// 会社の種類のいいところと注意点。開業のときは、開業時に借りられる額を並べる
function formPoints(id, start) {
  const f = FORMS[id], k = start ? 1 : scaleOf(me()), good = [], bad = [];
  if (f.cost) bad.push(`${start ? '開業費' : '変更費'} ${yen(f.cost)}`, `毎年の維持費 ${yen(f.upkeep)}`);
  else good.push(`${start ? '開業費' : '変更費'}も維持費も0円`);
  (f.credit > 1 ? good : bad).push(start ? (f.credit > 1 ? `開業時に ${yen(openLimit(id))}まで借りられる` : `開業時に借りられるのは ${yen(openLimit(id))}まで`) : `借入は1回 ${yen(f.credit * CFG.LOAN * k)}まで`);
  if (id === 'solo') { good.push('少ない利益は税金が安い'); bad.push('儲かるほど税金が重い'); } else good.push('税金は利益の25%で一定');
  if (id === 'kk') good.push('出資を受けられる'); else if (id === 'llc') bad.push('出資は受けられない');
  return { good, bad };
}
function formCard(id, start, now = false) {

  return `<button class="bigcard form" data-go="${id}"${now ? ' disabled' : ''}><span class="cb"><b>${FORMS[id].name}${now ? '(今の種類)' : ''}</b><span class="both">${list('good', 'いいところ', good)}${list('bad', '注意', bad)}</span></span></button>`;
}
function formSheet(p) {
  const rows = Object.keys(FORMS).map(id => formCard(id, false, id === p.form)).join('');
  return sheet(`<div class="card"><h2 class="ask big">会社の種類を変える</h2><div class="cards forms">${rows}</div>${ghost('このままにする', 'no')}</div>`, 'wide');
}

const INVEST_ROW = p => Object.keys(INVEST).map(id => p.level[id]).join(' / ');

// 年末。全社が同時に決算して、順位を見比べる
async function yearEnd() {
  const y = yearNow(g), final = y === CFG.YEARS - 1, p = me();

  const before = snap(p), res = closeYear(g);
  update();
  $('earn').hidden = true;
  await mySettle(res.list[0], y, before);

  if (res.low >= 0) { S.coin(); await banner('支援金', `最下位の P${res.low + 1} に +${yen(res.aid)}(平均資産の${Math.round(CFG.AID_RATE * 100)}%)`, 'good'); update(); }
  for (const [k, who] of [[0, res.pest], [1, res.claimer]]) {
    if (who < 0) continue;
    update();
    if (who === 0) await hauntSheet(HAUNTS[k], '1位の会社に来た');

  }

  closeSheet();
  await yearMenu(p, y + 2);
}

// 進んだマスの数だけ売上が入る。分かれ道では歩いている途中で選ぶ
async function walk(i, n, quick) {
  const p = g.players[i], out = { gain: 0, steps: 0 };
  for (let k = 0; k < n; k++) {
    const node = nodeOf(g, p);
    let lane = 0;
    if (node.next.length > 1) lane = i === 0 ? await myFork(p, node, n - k) : rivalFork(i, node);
    const s = stepTo(g, i, node.next[lane]);
    out.gain += s.gain; out.steps += 1;
    if (!quick) S.hop(); else if (k === n - 1) S.hop();
    renderHud();
    showEarn(i, out.steps, out.gain);
    await G.hop(i, p.at, quick ? 95 : 150, true);
    if (s.lap) { if (i === 0) { S.good(); meet(HQ); } update(); say(i, `一周した<em>売上 +${perTile(s.lap)}</em>`, 'good'); await wait(quick ? 450 : 900); hush(); }
    if (s.exit) await leaveLane(i, s.exit, quick);
    if (s.handed >= 0) { update(); say(s.handed, '悪徳コンサルが移った', 'bad'); await wait(quick ? 400 : 700); hush(); if (s.handed === 0) await hauntSheet(HAUNTS[0], `P${i + 1}から移ってきた`); }
    if (s.claimed >= 0) { update(); say(s.claimed, 'クレーマーが移った', 'bad'); await wait(quick ? 400 : 700); hush(); if (s.claimed === 0) await hauntSheet(HAUNTS[1], `P${i + 1}から移ってきた`); }
    if (s.freed) { update(); if (i === 0) S.shield(); say(i, '振り返りで対応を見直した<em>クレーマーが離れた</em>', 'good'); await wait(quick ? 450 : 900); hush(); }
  }
  return out;
}

// 分かれ道の先の道を抜けた。道ごとの効果が起きる。攻める道はサイコロで勝負
async function leaveLane(i, way, quick) {
  const p = g.players[i], lane = FORKS[way[0]].lanes[way[1]], bet = lane.pass.bet, roll = die(), before = snap(p);
  // 勝負の道は、抜けたところで新しくサイコロを振って決める
  if (bet && i === 0) {
    await sheet(`<div class="card"><p class="kicker">${lane.name}を抜けた</p><h2 class="ask big">サイコロで勝負</h2><p class="note center">${fxText(p, lane.pass, g).join('<br>')}</p>${carry('サイコロを振る')}</div>`);
    S.dice();
    await spin(roll, '勝負の目は…');
  } else if (bet) {
    S.dice();
    await G.rollDice([roll], p.at);
    await wait(quick ? 350 : 600);
    G.hideDice();
  }
  const text = d => fxText(p, d, g).join('、');
  const res = passLane(g, i, way, roll), done = bet ? (res.win ? bet.hi : bet.lo) : lane.pass, bad = bet && !res.win;
  update();
  if (i === 0) { meet(lane); if (bad) { S.bad(); shake(); } else S.good(); }
  if (bet && i === 0) {
    if (!bad && res.amount) burst(res.amount);
    await sheet(`<div class="card"><div class="stamp${bad ? ' bad' : ''}">${bad ? '負け' : '勝ち'}</div><p class="sum">目は ${roll}</p><p class="note center big-note">${bad ? text(done) : `+${yen(res.amount)}`}</p>${changes(before, p)}${carry()}</div>`);
    closeSheet();
  } else {
    say(i, `${lane.name}を抜けた<em>${bet ? `目は${roll} ・ ` : ''}${res.amount ? `+${yen(res.amount)}` : text(done)}</em>`, bad ? 'bad' : 'good');
    await wait(quick ? 600 : 1100); hush();
  }
  if (i === 0) { for (let k = 0; k < (res.card || 0); k++) await offer(p, `<h2 class="ask">${lane.name}を抜けた。カードを1枚もらえる</h2>`); closeSheet(); await coverShort(p); closeSheet(); }
  else autoCards(g, p, rivals[i - 1], res.card || 0, Math.random);
}

function dockWait(html) {

function coach() {
  const s = stormNext(g), left = CFG.PER_YEAR - turnOf(g);
  if (g.turn === 0) return 'サイコロを振って進む。進んだマスの数だけ売上が入る';
  if (s && s.at > g.turn) return `もうすぐ: ${s.tile.name}`;
  return left === 1 ? 'このターンのあとで決算' : `決算まで あと${left}ターン`;
}

async function myTurn() {
  const p = me();
  g.current = 0; update();
  mapOn = false;
  G.setActive(0); G.view('follow', p.at);
  if (g.pest === 0) await pestScene(0);
  await startTurn(0);
  let used = false;
  for (;;) {
    canPeek = true;
    const go = await dockWait(commands(p, used));
    canPeek = false;
    if (go === 'roll') break;
    $('action').innerHTML = '';
    if (go === 'cards') { if (await handSheet(p)) used = true; closeSheet(); }
    if (go === 'invest') { await investSheet(p); closeSheet(); }
    if (go === 'plan') compareSheet();
    if (go === 'map') mapOn = !mapOn;
    G.view(mapOn ? 'all' : 'follow', p.at);
  }
  mapOn = false;
  $('action').innerHTML = '';
  G.view('follow', p.at);
  const list = p.aim ? [p.aim] : Array.from({ length: p.sum }, die);
  p.aim = 0; p.sum = 1;
  S.dice();
  await G.rollDice(list, p.at);
  await wait(420);
  const steps = list.reduce((a, b) => a + b, 0);
  await rateBanner(p, steps);
  G.hideDice();
  const w = await walk(0, steps);
  S.coin(); burst(w.gain, TRADES[p.trade].later ? 'paper' : 'gold'); update();
  await wait(420);
  await land(p);
  G.setActive(-1);
}

async function rivalTurn(i) {
  const p = g.players[i], q = rivals[i - 1];
  g.current = i; renderHud();
  G.setActive(i); G.view('follow', p.at);
  await pause(240);
  if (g.pest === i) await pestScene(i);
  await startTurn(i);
  const a = q.act(g, p);
  if (a) {
    const c = CARDS[a.id], text = cardText(p, a.id), before = snap(me()), res = useCard(g, i, a.id, a.opt);
    update();
    say(i, `${c.name}<em>${res.hit ? hitText(g, res.hit) : text}</em>`, 'plain');
    await pause(700); hush();
    if (res.hit?.to === 0) await struck(i, c.name, res.hit, before);
  }
  let steps = 0;
  if (p.aim) steps = p.aim; else for (let k = 0; k < p.sum; k++) steps += die();
  p.aim = 0; p.sum = 1;
  await walk(i, steps, true);
  update();
  const before = snap(me()), res = autoLand(g, p, q, Math.random);
  update();
  say(i, `${tileName(res.t, p.trade)}<em>${res.text}</em>`, res.tone);
  G.cheer(i, res.tone === 'bad');
  if (res.tone === 'bad') S.bad(); else if (res.tone === 'good') S.coin();
  await pause(950);
  hush();
  if (res.hit?.to === 0) await struck(i, tileName(res.t, p.trade), res.hit, before);
  G.setActive(-1);
}

async function playGame() {
  g.history = [g.players.map(worth)];
  for (g.turn = 0; !isOver(g); g.turn++) {
    if (turnOf(g) === 0) await newYear();
    if (isMidYear(g)) await halfYear();
    update();
    const storm = stormNow(g);
    if (storm) await stormScene(storm);
    await myTurn();
    for (let i = 1; i < g.players.length; i++) await rivalTurn(i);
    if (isYearEnd(g)) await yearEnd();
  }
  await finale();
}

// 5年の資産の移り変わりの折れ線。開業から毎年の決算のあとまで
function historyChart() {
  const rows = g.history, W = 320, H = 170, L = 8, R = 78, T = 10, B = 22, top = Math.max(1, ...rows.flat());
  const x = j => L + (W - L - R) * j / (rows.length - 1), y = v => T + (H - T - B) * (1 - Math.max(0, v) / top);
  const tagY = [];
  g.players.map((_, i) => ({ i, y: y(rows[rows.length - 1][i]) })).sort((a, b) => a.y - b.y).forEach((t, n, list) => { tagY[t.i] = n ? Math.max(t.y, tagY[list[n - 1].i] + 14) : t.y; });
  const lines = g.players.map((_, i) => {
    const d = rows.map((r, j) => `${j ? 'L' : 'M'}${x(j).toFixed(1)} ${y(r[i]).toFixed(1)}`).join(' ');
    return `<path d="${d}" pathLength="1" class="line" style="--c:${G.PLAYERS[i].color};--d:${i * .25}s"/><text x="${W - R + 6}" y="${tagY[i] + 4}" style="fill:${G.PLAYERS[i].color}">P${i + 1} ${yen(rows[rows.length - 1][i])}</text>`;
  }).join('');
  const ticks = [0, 5, rows.length - 1].map(j => `<text x="${x(j)}" y="${H - 6}" class="tick">${j ? `${j}年` : '開業'}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${CFG.YEARS}年の資産の移り変わり"><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" class="axis"/>${lines}${ticks}</svg></div>`;
}
// 数字を0から数え上げる。画面が裏に回って描き替えが止まっても、時間がたてば最後の数字にして先へ進む
function countUp(el, value) {
  if (calm) { el.textContent = yen(value); return Promise.resolve(); }
  return new Promise(done => {
    const start = performance.now(), ms = 900 * tempo();
    let over = false;
    const end = () => { if (over) return; over = true; el.textContent = yen(value); done(); };
    const step = now => { if (over) return; const k = Math.min(1, (now - start) / ms); el.textContent = yen(value * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else end(); };
    requestAnimationFrame(step);
    setTimeout(end, ms + 250);
  });
}

  for (let n = order.length - 1; n >= 0; n--) {

// 経営者レベル判定の問題。この5年で出会った本の言葉の説明文から出す。外れの選択肢は同じ科目の言葉で、出会った言葉を先に使う
function makeQuiz(n) {
  const all = allNotes(), seen = [...met.values()].filter(x => x.term && x.def);
  const pool = shuffle(seen, Math.random);
  if (pool.length < n) pool.push(...shuffle(all.filter(x => !met.has(x.term)), Math.random).slice(0, n - pool.length));
  return pool.slice(0, n).map(answer => {
    const other = x => x.term !== answer.term, same = x => x.subject === answer.subject;
    const wrong = [];
    for (const list of [seen.filter(x => other(x) && same(x)), all.filter(x => other(x) && same(x)), seen.filter(other), all.filter(other)]) {
      for (const x of shuffle([...list], Math.random)) if (wrong.length < 3 && !wrong.some(w => w.term === x.term)) wrong.push(x);
    }
    const hint = answer.name && answer.name !== answer.term ? `ゲームでは「${answer.name}」で出てきた` : '';
    return { answer, hint, choices: shuffle([answer, ...wrong], Math.random) };
  });
}
// 早押しの1問。自分は選択肢を押す。相手の会社は決めておいた時間に押す。合っていても、先に正しく押されたら取れない
const RIVAL_SKILL = [.5, .65, .55];
function speedRound(no, q, got) {
  const plans = g.players.map((_, i) => i).slice(1).map(i => ({ i, ...buzzPlan(RIVAL_SKILL[(i - 1) % RIVAL_SKILL.length], q.choices.length, Math.random) }));
  const buzzers = g.players.map((_, i) => `<span class="buzz" id="bz${i}">${badge(i)}<b>${got[i]}</b></span>`).join('');
  const html = `<div class="card quiz"><div class="buzz-top"><p class="kicker">第${no}問 / ${QUIZ} ・ 早押し</p><div class="buzzers">${buzzers}</div></div>
    <div class="timer"><i style="animation-duration:${QUIZ_SEC}s"></i></div>
    <p class="quiz-q">${q.answer.def}</p><h2 class="ask">これを何という?</h2>
    <div class="cards">${q.choices.map((c, i) => `<button class="bigcard" data-go="${i}"><span class="cb"><b>${c.term}</b></span></button>`).join('')}</div>
    <p class="buzzlog" id="buzzlog"></p></div>`;
  return new Promise(done => {
    let over = false, mine = 'none';
    const timers = [], log = text => { const el = $('buzzlog'); if (el) el.innerHTML = text; };
    const finish = winner => { if (over) return; over = true; timers.forEach(clearTimeout); resolveSheet = null; done({ winner, mine }); };
    sheet(html).then(v => {
      if (over) return;
      if (q.choices[+v] === q.answer) { mine = 'ok'; S.good(); $('bz0')?.classList.add('hit'); finish(0); return; }
      mine = 'miss'; S.bad();
      $('sheet').querySelectorAll('.bigcard').forEach(b => { b.disabled = true; });
      $('sheet').querySelector(`.bigcard[data-go="${v}"]`)?.classList.add('wrong');
      $('bz0')?.classList.add('miss');
      log('お手つき。この問題はもう答えられない');
    });
    for (const pl of plans) timers.push(setTimeout(() => {
      if (over) return;
      S.tick();
      if (pl.ok) { $(`bz${pl.i}`)?.classList.add('hit'); log(`P${pl.i + 1}が押した! 正解`); finish(pl.i); }
      else { $(`bz${pl.i}`)?.classList.add('miss'); log(`P${pl.i + 1}がお手つき`); }
    }, pl.t * 1000));
    timers.push(setTimeout(() => finish(-1), QUIZ_SEC * 1000));
  });
}
// 5年後の経営者レベル判定。全社で早押し。取った問題の数でレベルが決まり、自分の資産が増減する
async function levelTest() {
  const list = LEVELS.map(l => `<li><span>${l.name}</span><small>${l.min ? `${l.min}問以上取る` : '1問も取れない'}</small><b class="${l.rate < 0 ? 'minus' : l.rate ? '' : 'even'}">${l.rate ? `資産の${l.rate > 0 ? '+' : ''}${Math.round(l.rate * 100)}%` : '増減なし'}</b></li>`).join('');
  S.fanfare();
  await sheet(`<div class="card"><p class="kicker">ボーナスチャンス</p><h2 class="ask big">経営者レベル判定</h2><p class="note">この${CFG.YEARS}年で出会った言葉から${QUIZ}問の早押し。いちばん早く正しく答えた会社がその問題を取る。合っていても遅ければ取れない。間違えると、その問題はもう答えられない</p><ul class="others levels">${list}</ul>${carry('始める')}</div>`);
  const quiz = makeQuiz(QUIZ), got = g.players.map(() => 0);
  for (const [n, q] of quiz.entries()) {
    const r = await speedRound(n + 1, q, got);
    if (r.winner >= 0) got[r.winner] += 1;
    if (r.winner > 0) await new Promise(res => setTimeout(res, 900));
    const who = r.winner === 0 ? 'あなたが取った' : r.winner > 0 ? `P${r.winner + 1}が取った` : 'だれも取れなかった';
    const mine = { ok: '正解', miss: 'お手つき', none: r.winner > 0 ? '間に合わなかった' : '時間切れ' }[r.mine];
    await sheet(`<div class="card"><div class="stamp${r.winner === 0 ? '' : ' bad'}">${who}</div><p class="sum">${q.answer.term}</p><p class="note">${q.answer.def}</p>${q.hint ? `<p class="sub">${q.hint}</p>` : ''}<p class="sub">${q.answer.subject} ・ あなた: ${mine}</p>
      <div class="buzzers wide">${g.players.map((_, i) => `<span class="buzz">${badge(i)}<b>${got[i]}</b></span>`).join('')}</div>${carry(n < quiz.length - 1 ? '次の問題' : '判定を見る')}</div>`);
  }
  const results = g.players.map((p, i) => ({ i, n: got[i], lv: levelOf(got[i]), bonus: levelBonus(p, got[i]) }));
  update();
  const mine = results[0];
  if (mine.lv.rate > 0) { S.fanfare(); confetti(); } else if (mine.lv.rate < 0) { S.bad(); shake(); }
  const money = n => `${n > 0 ? '+' : ''}${n ? yen(n) : '増減なし'}`;
  await sheet(`<div class="card"><p class="kicker">あなたの経営者レベル</p><div class="stamp level${mine.lv.rate < 0 ? ' bad' : ''}">${mine.lv.name}</div><p class="sum">${QUIZ}問中 ${mine.n}問を取った</p><b class="amount${mine.bonus < 0 ? ' minus' : ''}">${money(mine.bonus)}</b>
    <ul class="others">${results.slice(1).map(o => `<li>${badge(o.i)}<span>${o.lv.name}<small>${o.n}問を取った</small></span><b class="${o.bonus < 0 ? 'minus' : ''}">${money(o.bonus)}</b></li>`).join('')}</ul>${carry('最終順位へ')}</div>`);
  closeSheet();
}

// 開業の準備を、決めたところまで会社に当てはめる。戻ったときも最初から組み直す
function prepare(p, st, upto) {
  Object.assign(p, newPlayer(p.name, false));
  if (upto > 1) found(p, st.trade, st.form);
  if (upto > 2 && st.loan) borrow(p, st.loan, false, openRate(st.form, st.loan));
  if (upto > 3) st.invest.forEach(id => invest(p, id));
  if (upto > 4) openOffers(p).filter(x => st.goods.has(x.name)).forEach(x => buy(p, x));
  update();
}
const backBtn = () => ghost('一つ前に戻る', 'back');
const stepNo = n => `<p class="kicker">開業の準備 ${n} / 4</p>`;

async function tradeStep(p, st) {
  const rows = Object.entries(TRADES).map(([id, t]) => `<button class="bigcard" data-go="${id}"><span class="cb"><b>${t.name}</b><span class="eff">最初の商品: ${GOODS[id][0][0]}</span><small>${t.note}</small></span></button>`).join('');
  st.trade = await sheet(`<div class="card"><h2 class="ask big">何の会社を始める?</h2><div class="cards">${rows}</div></div>`, 'wide');
}

async function formStep(p, st) {
  const rows = Object.keys(FORMS).map(id => formCard(id, true)).join('');

// 開業資金。自己資金は全社同じで、銀行からいくら借りるかを選ぶ。多く借りるほど最初から大きく動けるが、金利が上がり返済も重い
async function loanStep(p, st) {
  const top = openLimit(p.form), tone = ['手堅い', '', 'ふつう', '', '攻める'];
  const rows = [0, .25, .5, .75, 1].map((k, j) => {
    const n = tenth(top * k), rate = openRate(p.form, n), year = n / CFG.REPAY + n * rate;
    return `<button class="buy" data-go="${n}"><span>${n ? `${yen(n)}借りる` : '借りない'}${tone[j] ? `<i class="risk r${j}">${tone[j]}</i>` : ''}<small>${n ? `金利 年${+(rate * 100).toFixed(1)}% ・ 毎年の決算で 返済 ${yen(n / CFG.REPAY)} + 利息 ${yen(n * rate)}` : '返済も利息もない'}</small></span><b>現金 ${yen(p.cash + n)}</b></button>`;
  }).join('');
  const go = await sheet(`<div class="card">${stepNo(2)}<h2 class="ask big">銀行からいくら借りる?</h2><p class="note">自己資金は全社同じ ${yen(CFG.SEED)}${FORMS[p.form].cost ? `。開業費を払って、今の現金は ${yen(p.cash)}` : ''}。${FORMS[p.form].name}は ${yen(top)}まで借りられる。</p><p class="sub">多く借りるほど、最初から投資や開発に回せる。そのかわり金利が上がり、毎年の返済も重い。決算で払えないと銀行の立て替え(1.2倍)になる</p><div class="cards">${rows}</div>${backBtn()}</div>`);
  if (go === 'back') return go;
  st.loan = +go;
  if (st.loan) { S.coin(); burst(st.loan); }
}

// 同じ画面でいくつでも選べて、押し直すと外せる。戻って現金や投資が変わったら、足りない分は外しておく
async function pickStep(p, { no, title, items, chosen, finish, note = 'いくつでも選べる。もう一度押すと外せる', head = null }) {
  let spare = p.cash, room = shelfOf(p) - p.goods.length;
  for (const key of chosen) if (!items.some(x => x.key === key)) chosen.delete(key);
  for (const x of items) if (chosen.has(x.key)) { if (x.lock || x.price > spare || (x.slot && room <= 0)) chosen.delete(x.key); else { spare -= x.price; if (x.slot) room -= 1; } }
  const picked = () => items.filter(x => chosen.has(x.key));
  const stat = (label, now, was, heavy, show = yen) => {
    const d = tenth(now - was), good = heavy ? d < 0 : d > 0;
    return `<span>${label}<b>${show(now)}</b><small class="${d ? (good ? 'up' : 'down') : ''}">${d ? `${d > 0 ? '+' : ''}${show(d)}` : '変わらず'}</small></span>`;
  };
  const row = (x, sim) => {
    const on = chosen.has(x.key), full = x.slot && !on && sim.goods.length >= shelfOf(sim), can = !x.lock && !full && (on || x.price <= sim.cash);
    const why = x.lock || (full ? '商品棚がいっぱい(設備で増やせる)' : can ? x.note : '現金が足りない');
    return `<button class="buy pick${on ? ' on' : ''}" data-pick="${x.key}" aria-pressed="${on}"${can ? '' : ' disabled'}><i class="tick"></i><span>${x.name}${x.tag || ''}<small class="${x.lock || full ? 'lock' : ''}">${why}</small></span>${x.life || ''}<b>${yen(x.price)}</b></button>`;
  };
  const draw = () => {
    const sim = JSON.parse(JSON.stringify(p));
    picked().forEach(x => x.run(sim));
    tidy(sim);
    $('pick').innerHTML = `<div class="money four">${stat('資産', worth(sim), worth(p))}${stat('現金', sim.cash, p.cash)}${stat('1マスの売上', powerOf(sim), powerOf(p), false, perTile)}${stat('毎年の固定費', fixOf(sim), fixOf(p), true)}</div>
      <p class="sub">1年目の決算で払う固定費と返済 ${yen(fixOf(sim) + repayOf(sim) + interestOf(sim))}</p>
      ${head ? head(sim) : ''}<div class="cards invest">${items.map(x => row(x, sim)).join('')}</div>
      ${carry(finish(chosen.size))}${backBtn()}`;
  };
  onPick = key => { if (chosen.has(key)) chosen.delete(key); else chosen.add(key); draw(); };
  const done = sheet(`<div class="card">${stepNo(no)}<h2 class="ask big">${title}</h2><p class="sub">${note}</p><div class="pick-box" id="pick"></div></div>`, 'wide');
  draw();
  const go = await done;
  onPick = null;
  return go;
}

function investStep(p, st) {
  const items = Object.keys(INVEST).map(id => ({ key: id, name: `${INVEST[id].label}: ${investName(p, id)}`, price: stepOf(p, id).price, note: `${INVEST[id].what}<br>${stepNote(p, id)}`, run: q => invest(q, id) }));
  return pickStep(p, { no: 3, title: '初期投資', items, chosen: st.invest, note: 'いくつでも選べるが、毎年の費用も増える。作戦に合うものに絞る', finish: n => (n ? `${n}つ投資して次へ` : '投資せずに次へ') });
}
// 商品は会社の売り物。棚の数までしか持てない
function goodsStep(p, st) {
  const items = openOffers(p).map(x => ({ key: x.name, name: x.name, tag: genreTag(p, x.genre), slot: true, price: x.price, life: curve(p, x), run: q => buy(q, x), lock: x.ok ? '' : lockNote(p, x), note: goodsNote(p, x) }));
  return pickStep(p, { no: 4, title: '商品開発', items, chosen: st.goods, note: `商品は会社の売り物。持っている商品の売上の合計が、1マス進むごとに入る。同じ分野がそろうとよく売れる。今は${p.goods[0].name}だけ`,
    head: sim => `<p class="sub">商品棚 ${sim.goods.length} / ${shelfOf(sim)}</p>`, finish: n => (n ? `${n}つ開発して次へ` : '開発せずに次へ') });
}

function rivalsOpen(trade) {
  const rest = shuffle(Object.keys(TRADES).filter(t => t !== trade), Math.random), kinds = Object.keys(FORMS);
  return g.players.map((_, i) => i).slice(1).map(i => {
    const q = g.players[i], k = pick(kinds);
    Object.assign(q, newPlayer(q.name, true));
    found(q, rest[i - 1], k);
    return { i, acts: autoOpen(g, q, rivals[i - 1], Math.random) };
  }).filter(m => m.acts.length);
}
async function faceStep(p, st) {
  if (!st.moves || g.players.slice(1).some(q => q.trade === st.trade)) st.moves = rivalsOpen(st.trade);
  update();
  return sheet(`<div class="card"><h2 class="ask big">${g.players.length}社で競う</h2>${compare()}${st.moves.length ? `<ul class="others">${st.moves.map(m => `<li>${badge(m.i)}<span>${m.acts.join(' / ')}</span></li>`).join('')}</ul>` : ''}<p class="note center">${CFG.YEARS}年後、資産がいちばん多い会社の勝ち</p>${carry('開業する')}${backBtn()}</div>`, 'wide');
}

// 開業。業種のあとに、会社の種類→借入→初期投資→商品開発の順に決める。どの画面からも一つ前に戻れる
async function opening() {
  const p = me(), st = { trade: '', form: '', loan: 0, invest: new Set(), goods: new Set(), moves: null };
  const steps = [tradeStep, formStep, loanStep, investStep, goodsStep, faceStep];
  for (let i = 0; i < steps.length;) {
    prepare(p, st, i);
    i += await steps[i](p, st) === 'back' ? -1 : 1;
  }
  closeSheet();
  [FORMS[st.form], OPENING.capital, st.loan && OPENING.loan, ...[...st.invest].map(id => ({ ...INVEST[id], name: INVEST[id].names(p)[0][0] })), OPENING.cash].forEach(meet);
  if (new Set(p.goods.map(x => x.genre)).size < p.goods.length) meet(SYNERGY);
  G.build(g, st.trade);
  if (st.invest.size || st.goods.size) { S.good(); G.cheer(0); }
}

    '分かれ道は、道を抜けると何かが起きる(手堅い道は平均資産の3%か売上アップ、攻める道はサイコロ勝負、試す道はカードや営業力)。入るお金は全社の平均資産に合わせるので、下位の会社ほど大きく効く',
    '景気に合う道は追い風(好景気は攻める、ふつうは試す、不景気は手堅い)',
    'カードはサイコロの前に1ターン1枚使える。他社を狙う妨害と、それをはね返す守りもある',
    '新しい年になると、マスの並びが変わる',
    '営業力が上がると、営業・広報マスの売上と商品開発の値引きが増える',
  ]],
];

async function rulesFirst() {
  await sheet(`<div class="card rules"><h2 class="ask big">遊び方</h2><ol class="steps first">${RULES}</ol><p class="sub">ほかのことは、その場面で説明が出る。あとで画面下の「?」から読める</p>${carry('始める')}</div>`, 'wide');
  closeSheet();
}
function rulesSheet() {
  const more = MORE.map(([title, list]) => `<details class="rule-g"><summary>${title}</summary><ul class="steps small">${list.map(x => `<li>${x}</li>`).join('')}</ul></details>`).join('');
  return sheet(`<div class="card rules"><h2 class="ask big">ルール</h2><ol class="steps">${RULES}</ol>${more}
    <p class="sub">マスを押すと説明が出る。「×1」のボタンで速さを2倍、3倍にできる</p>
    <div class="row">${btn('閉じる', 'back', true, 'big')}${resolveDock ? ghost('やめてタイトルへ', 'title') : ''}</div></div>`, 'wide');
}

async function toTitle() {
  closeSheet();
  resolveDock = null;
  $('app').classList.add('title');
  G.setActive(-1); G.idle(true);
  const notes = allNotes(), got = notes.filter(t => book.notes[t.term]).length;
  const go = await sheet(`<div class="hero">
    <h1>経営<br>ロード</h1>
    <p>${CFG.YEARS}年後、資産がいちばん多い会社の勝ち</p>
    ${btn('ゲームを始める', 'start', true, 'big')}
    ${ghost(`本の言葉ノート ${got} / ${notes.length}`, 'book')}
    ${book.games ? `<small>${book.games}戦 ${book.wins}勝</small>` : ''}
  </div>`, 'hero-wrap');
  if (go === 'start') { S.good(); startGame(); return; }
  await bookSheet();
  toTitle();
}

const openRules = async () => {
  if (!resolveDock) return;
  const saved = resolveDock;
  const go = await rulesSheet();
  closeSheet();
  if (go === 'title') toTitle(); else resolveDock = saved;
};

function setSpeed() {
  const el = $('speed');
  el.textContent = `×${book.speed}`;
  el.classList.toggle('on', book.speed > 1);
  el.setAttribute('aria-label', `進む速さ ×${book.speed}。押すと変わる`);
  G.setPace(tempo());
}
function setMute() {
  $('mute').classList.toggle('off', book.mute);
  $('mute').setAttribute('aria-label', book.mute ? '音を出す' : '音を消す');
}

document.addEventListener('click', e => {
  S.unlock();
  if (e.target.closest('[data-peek-close]')) { $('peek').hidden = true; return; }
  const co = e.target.closest('[data-co]');
  if (co) { S.tap(); company(+co.dataset.co); return; }
  if (e.target.closest('[data-all]')) { S.tap(); compareSheet(); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { G.zoomBy(z.dataset.zoom === 'in' ? .8 : 1.25); return; }
  const tog = e.target.closest('[data-pick]');
  if (tog && onPick) { S.tap(); onPick(tog.dataset.pick); return; }
  const go = e.target.closest('[data-go]');
  if (go) {
    if (!go.disabled && resolveSheet) { S.tap(); const f = resolveSheet; resolveSheet = null; f(go.dataset.go); }
    return;
  }
  const act = e.target.closest('[data-do]');
  if (act && resolveDock && !act.disabled) { S.tap(); const f = resolveDock; resolveDock = null; f(act.dataset.do); return; }
  if (e.target.closest('#rulesBtn')) { openRules(); return; }
  if (e.target.closest('#alarm')) {
    const s = stormNext(g);
    if (s) peek(`<h2 class="ask big">${s.tile.name}</h2><p class="note">${s.tile.by ? Object.entries(TRADES).map(([id, t]) => `${t.name} ${s.tile.by[id] > 0 ? '+' : ''}${s.tile.by[id] ? `資産の${s.tile.by[id]}%` : '影響なし'}`).join(' / ') + `<br>あなたなら ${worldAmount(me(), s.tile) > 0 ? '+' : ''}${s.tile.by[me().trade] ? yen(worldAmount(me(), s.tile)) : '影響なし'}` : s.tile.price ? '費用が上がり、売上も下がる。借金の重さは軽くなる。値上げするかどうかを選ぶ。' : '借金がある会社に効く'}</p>`);
    return;
  }
  if (e.target.closest('#mute')) { book.mute = !book.mute; saveBook(); setMute(); return; }
  if (e.target.closest('#speed')) { book.speed = SPEEDS[(SPEEDS.indexOf(book.speed) + 1) % SPEEDS.length]; saveBook(); setSpeed(); return; }
  if (skipWait) skipWait();
});

(async () => {
  G.init($('stage'));
  G.onTapTile(i => {
    if (!g || !canPeek || resolveSheet) return;
    peekTile(i);
  });
  g = newGame(Math.random, NAMES);
  g.turn = -1; g.current = -1;
  setMute();
  setSpeed();
  G.build(g);
  toTitle();
  await fontsFor();
  if (g.turn === -1) G.build(g);
})();
</script>
</body>
</html>
