<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="経営の流れを一周する盤で、5年後の資産を競うボードゲーム。中小企業診断士の言葉が、出来事として出てくる。">
<title>経営ロード</title>
<meta name="theme-color" content="#0a0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="経営ロード">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 明るい道の上に、紺の計器盤を重ねる。上の年表で全員の位置が分かる。縦は道が上で操作が下、横は道が左で操作が右 */
:root {
  --night: #0a0d18;
  --panel: #131829;
  --panel2: #1b2138;
  --line: #2e3659;
  --ink: #eef1f8;
  --dim: #9aa4c2;
  --gold: #ffc83d;
  --red: #ff5a5f;
  --good: #4fe0a8;
  --head: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Hiragino Sans", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --num: "Rubik", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-weight: 500; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { position: relative; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
.stage { position: relative; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.zoom { display: flex; gap: 4px; pointer-events: auto; }
.zoom button { width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); background: rgba(13, 17, 32, .86); color: var(--ink); font-size: 20px; font-weight: 700; line-height: 1; }
#app.title .zoom { display: none; }
.stage.shake canvas { animation: shake .4s ease-out; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -3px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, -1px); } }

.hud { position: absolute; top: 8px; left: 0; right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.hud .left { display: grid; gap: 4px; width: min(180px, 52%); min-width: 0; }
.hud .right { display: grid; justify-items: end; gap: 5px; }
#chips { display: grid; gap: 4px; min-width: 0; }
#clock { display: grid; justify-items: center; gap: 4px; }
.clock { position: relative; width: 92px; height: 92px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35)); }
.clock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.clock .disc { fill: rgba(13, 17, 32, .9); stroke: var(--line); }
.clock path { fill: none; stroke-width: 8; stroke-linecap: round; }
.clock path.next { stroke: #3a4366; }
.clock path.past { stroke: var(--c); opacity: .45; }
.clock path.now { stroke: var(--c); stroke-width: 11; }
.clock .mid { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; line-height: 1; }
.clock .mid b { font-family: var(--num); font-size: 28px; font-weight: 800; color: var(--ink); }
.clock .mid small { margin-top: 1px; font-size: 10px; font-weight: 700; color: var(--dim); }
.clock .mid em { margin-top: 3px; font-style: normal; font-size: 15px; font-weight: 900; }
.weather { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; border-radius: 999px; background: rgba(13, 17, 32, .9); border: 1px solid var(--line); color: #cfd6ea; font-size: 11.5px; font-weight: 900; white-space: nowrap; }
.weather svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.weather.good { color: var(--gold); border-color: rgba(255, 200, 61, .6); }
.weather.bad { color: #9cc3ff; border-color: rgba(156, 195, 255, .55); }
.chip { position: relative; display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; background: rgba(13, 17, 32, .86); border: 1px solid var(--line); border-top: 2px solid var(--c); padding: 3px 5px; min-width: 0; pointer-events: auto; }
.chip.now { background: rgba(32, 40, 72, .97); outline: 1px solid var(--c); }
.chip.lead::after { content: "1位"; position: absolute; top: -8px; right: 2px; background: var(--gold); color: var(--night); font-size: 9.5px; font-weight: 900; padding: 0 4px; }
.pb { display: grid; place-items: center; flex: none; width: 24px; height: 22px; background: var(--c); color: #fff; font-family: var(--num); font-weight: 700; font-size: 11px; }
.nums { display: grid; min-width: 0; line-height: 1.15; }
.chip .pb { width: 17px; font-size: 9px; align-self: stretch; height: auto; }
.asset { display: flex; align-items: baseline; gap: 2px; min-width: 0; }
.nums b { font-family: var(--num); font-weight: 700; font-size: 13.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nums small { flex: none; width: 21px; font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.u { font-size: .74em; margin-left: 1px; letter-spacing: 0; white-space: nowrap; }
.money b { white-space: nowrap; }
.money.four .u { font-size: 8.5px; }
.nums .u { font-size: 9px; color: var(--dim); }
.asset.tile b { font-size: 12.5px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.side { display: flex; gap: 4px; flex: none; }
.turns { display: grid; place-items: center; background: var(--panel2); color: var(--dim); width: 38px; height: 34px; font-size: 9px; line-height: 1; }
.turns b { font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--ink); }
.round { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; font-weight: 700; padding: 0; color: var(--ink); }
.round.off { color: var(--dim); text-decoration: line-through; }
#speed { font-family: var(--num); font-size: 14px; }
#speed.on { color: var(--gold); border-color: var(--gold); }

.earn { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; width: 100%; min-width: 0; text-align: left; background: rgba(13, 17, 32, .9); border: 1px solid var(--line); padding: 2px 8px 2px 4px; font-size: 12px; font-weight: 700; color: var(--ink); pointer-events: auto; }
.earn .pb { width: 22px; height: 18px; font-size: 9.5px; }
.earn span:not(.pb) { min-width: 0; color: var(--dim); }
.earn b { margin-left: auto; flex: none; font-family: var(--num); font-weight: 700; font-size: 14px; color: var(--gold); font-variant-numeric: tabular-nums; }
.alarm { justify-self: end; max-width: 150px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; justify-content: center; border: 1px solid var(--red); background: rgba(60, 14, 28, .92); color: var(--ink); padding: 3px 12px; font-size: 12px; pointer-events: auto; max-width: 100%; animation: throb 1.6s ease-in-out infinite; }
.alarm b { color: var(--red); font-weight: 900; }
@keyframes throb { 50% { box-shadow: 0 0 14px rgba(255, 90, 95, .55); } }

.bubble { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; width: min(calc(100% - 32px), 380px); box-sizing: border-box; background: rgba(13, 17, 32, .94); border: 1px solid var(--line); padding: 8px 12px; animation: rise .2s ease-out; pointer-events: none; }
.bubble .line { display: grid; gap: 1px; font-size: 13.5px; line-height: 1.35; min-width: 0; }
.bubble em { font-style: normal; font-weight: 900; font-size: 14.5px; }
.bubble small { font-size: 12px; color: var(--dim); }
.bubble .plus { color: var(--gold); font-weight: 900; font-size: 13px; }
.bubble.good em { color: var(--good); }
.bubble.bad em { color: var(--red); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

.banner { --c: var(--gold); position: absolute; left: 0; right: 0; top: 34%; z-index: 6; text-align: center; padding: 10px 16px 12px; background: rgba(8, 10, 20, .93); border-block: 2px solid var(--c); animation: sweep .26s cubic-bezier(.2, .9, .3, 1); pointer-events: none; }
.banner.bad { --c: var(--red); }
.banner b { display: block; font-family: var(--num); font-weight: 900; font-size: clamp(34px, 10vw, 58px); line-height: 1.15; color: var(--c); letter-spacing: .06em; }
.banner span { display: block; font-size: 15px; margin-top: 2px; }
.banner.rate { top: auto; bottom: 10px; padding-block: 6px 10px; }
.banner.rate span { margin-top: 0; font-size: 14px; font-weight: 700; color: var(--dim); }
.banner.rate b, .banner.rate em { display: block; font-family: var(--num); font-weight: 800; font-style: normal; font-size: clamp(32px, 9.5vw, 54px); line-height: 1.15; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.banner.rate b { color: var(--ink); }
.banner.rate em { color: var(--gold); }
.banner.rate i { margin-left: .4em; font-style: normal; font-size: .5em; color: var(--ink); letter-spacing: 0; }
.banner.rate small { margin-inline: .4em; font-size: .42em; color: var(--dim); letter-spacing: 0; }
@keyframes sweep { from { transform: scaleX(.3); opacity: 0; } }

.dock { position: relative; z-index: 2; background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 7px; align-content: start; min-height: 0; }
#app.title .dock, #app.title .hud { display: none; }
.status { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; color: var(--dim); min-width: 0; }
.pill { display: inline-flex; align-items: baseline; gap: 4px; }
.pill b { font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill.red b { color: var(--red); }
.wind { font-weight: 900; font-size: 11.5px; padding: 1px 6px; align-self: center; }
.wind.tail { background: var(--good); color: var(--night); }
.wind.head { background: var(--red); color: #fff; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.acts button { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: 46px; padding: 6px; background: rgba(255, 200, 61, .12); border: 1.5px solid var(--gold); color: var(--ink); font-size: 14.5px; font-weight: 900; white-space: nowrap; }
.acts button:active:not(:disabled) { background: rgba(255, 200, 61, .26); }
.acts button svg { color: var(--gold); }
.acts em { flex: none; font-style: normal; font-family: var(--num); font-size: 11px; font-weight: 700; color: var(--night); background: var(--gold); padding: 1px 6px; border-radius: 9px; }
.acts button:disabled { background: var(--panel2); border-color: var(--line); color: var(--dim); }
.acts button:disabled svg { color: var(--dim); }
.acts button:disabled em { background: var(--line); color: var(--dim); }
.views { display: flex; justify-content: center; gap: 8px; }
.views button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 13px; background: transparent; border: 1px solid var(--line); border-radius: 999px; color: #c9d0e6; font-size: 12.5px; font-weight: 700; }
.views button:active { background: var(--panel2); }
.acts svg, .views svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.views svg { width: 15px; height: 15px; }
.action { display: grid; gap: 6px; min-height: 118px; align-content: end; }
.coach { margin: 0; text-align: center; font-size: 12.5px; color: var(--dim); }

.btn { display: block; width: 100%; border: 0; background: var(--gold); color: var(--night); clip-path: var(--cut); font-family: var(--body); font-weight: 900; font-size: 16px; padding: 11px 12px; transition: filter .08s; }
.btn.big { font-size: 18px; padding: 13px 12px; }
.btn:active:not(:disabled) { filter: brightness(.85); }
.btn:disabled { background: #2a304a; color: #6c7596; cursor: default; }
.ghost { display: block; width: 100%; background: none; border: 0; color: var(--dim); font-size: 13.5px; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }

.sheet { position: absolute; z-index: 8; left: 0; right: 0; bottom: 8px; max-height: calc(100% - 64px); overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.sheet > * { pointer-events: auto; }
.sheet.hero-wrap { top: 0; bottom: 0; max-height: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 46%, rgba(8, 10, 20, .72), rgba(8, 10, 20, .12) 74%); }
.card { position: relative; max-width: 460px; margin: 0 auto; background: rgba(15, 19, 34, .97); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); padding: 12px 14px 12px; display: grid; gap: 8px; animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(16px); opacity: 0; } }
.card.small { max-width: 380px; }
.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 8px; align-items: center; }
.top small { color: var(--c); font-weight: 900; font-size: 13.5px; filter: brightness(1.5); }
.top h2 { grid-column: 1 / -1; }
.effect { background: var(--c); color: #fff; font-family: var(--num); font-weight: 900; font-size: 15px; padding: 1px 10px; }
.top h2 { margin: 0; font-weight: 900; font-size: 19px; line-height: 1.3; text-wrap: balance; }
.note { margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty; }
.note.loss { color: var(--red); font-weight: 900; font-size: 18px; text-align: center; }
.note.warn { color: var(--red); font-weight: 700; font-size: 13.5px; }
.big-note { font-weight: 900; font-size: 19px; color: var(--gold); }
.sub { margin: 0; text-align: center; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.flag { margin: 0; color: var(--good); font-weight: 700; font-size: 13.5px; }
.flag.bad { color: var(--red); }
.ask { margin: 0; font-weight: 900; font-size: 15.5px; }
.ask.big { font-family: var(--num); font-weight: 900; font-size: 22px; text-align: center; }
.ask.center, .note.center { text-align: center; }
.kicker { margin: 0; color: var(--gold); font-size: 12.5px; font-weight: 900; }
blockquote small { display: block; font-size: 11px; color: var(--dim); }
blockquote { margin: 0; padding: 7px 10px; border-left: 3px solid var(--gold); background: var(--panel2); font-size: 14.5px; line-height: 1.5; font-weight: 700; }
.row { display: grid; gap: 2px; }
.sum { margin: 0; text-align: center; font-size: 13.5px; color: var(--dim); }
.amount { display: block; text-align: center; font-family: var(--num); font-weight: 800; font-size: 42px; line-height: 1.15; color: var(--gold); text-shadow: 0 0 22px rgba(242, 193, 78, .4); animation: bump .3s cubic-bezier(.2, 1.5, .4, 1); }
.amount.later { color: #6fb7ff; text-shadow: none; font-size: 36px; }
.amount.small { margin: 0; font-size: 24px; }
@keyframes bump { from { transform: scale(.5); opacity: 0; } }
.stamp { justify-self: center; font-family: var(--num); font-weight: 900; font-size: 28px; color: var(--good); border-block: 2px solid currentColor; padding: 2px 18px; letter-spacing: .08em; animation: sweep .24s ease-out; }
.stamp.bad { color: var(--red); }
.total { display: flex; justify-content: space-between; align-items: baseline; border-block: 1px solid var(--gold); padding: 4px 10px; font-weight: 900; font-size: 14px; }
.total b { font-family: var(--num); font-weight: 700; font-size: 21px; color: var(--gold); font-variant-numeric: tabular-nums; }
.total b.minus { color: var(--red); }
.bigdie { justify-self: center; display: grid; place-items: center; width: 92px; height: 92px; margin: 6px; border: 1px solid var(--line); background: var(--panel2); font-family: var(--num); font-weight: 800; font-size: 52px; }
.bigdie.land { background: var(--ink); color: var(--night); animation: bump .26s cubic-bezier(.2, 1.5, .4, 1); }

.cards { display: grid; gap: 6px; }
.both { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pros { display: grid; align-content: start; gap: 1px; min-width: 0; }
.pros i { font-style: normal; font-size: 11px; font-weight: 900; }
.pros.good i { color: var(--good); }
.pros.bad i { color: var(--red); }
.pros small { font-size: 12px; line-height: 1.35; }
.forms .bigcard { padding-block: 6px; }
.forms .cb { align-content: start; }
.bigcard { position: relative; box-sizing: border-box; display: flex; align-items: stretch; gap: 9px; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); padding: 7px 10px 7px 7px; }
button.bigcard:active:not(:disabled) { filter: brightness(1.3); }
button.bigcard:disabled { opacity: .5; cursor: default; }
.cb { display: grid; gap: 1px; min-width: 0; flex: 1; }
.cb b { font-weight: 900; font-size: 15px; line-height: 1.35; }
.windtag { margin-left: 6px; background: var(--good); color: var(--night); font-style: normal; font-size: 11px; padding: 0 5px; vertical-align: 1px; }
.cb small { font-size: 12.5px; line-height: 1.45; color: #bcc4dc; }
.eff { font-size: 13px; line-height: 1.4; font-weight: 700; color: var(--gold); }
.mix { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.mix i { background: var(--c); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 900; padding: 1px 4px; }
.pick-box { display: grid; gap: 6px; }
.pick { justify-content: flex-start; padding-block: 5px; }
.pick > span:not(.curve) { flex: 1; min-width: 0; }
.pick.on { border-color: var(--gold); background: rgba(255, 200, 61, .13); }
.pick:disabled { opacity: .7; }
.pick small.lock, .cb small.lock { color: var(--red); font-weight: 700; }
.tick { flex: none; display: grid; place-items: center; box-sizing: border-box; width: 18px; height: 18px; border: 2px solid var(--dim); }
.pick.on .tick { background: var(--gold); border-color: var(--gold); }
.pick.on .tick::after { content: ""; width: 4px; height: 9px; margin-top: -2px; border: solid var(--night); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.curve { display: flex; align-items: flex-end; gap: 2px; flex: none; width: 46px; height: 28px; align-self: center; }
.curve i { flex: 1; background: #47507a; min-height: 2px; }
.curve i.on { background: var(--gold); }
.bigcard em { position: absolute; top: 3px; right: 7px; font-style: normal; color: var(--gold); font-size: 12px; }
.bigcard em.kind { color: var(--dim); font-size: 11px; font-weight: 700; }
.buy { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); padding: 7px 10px; font-size: 14px; font-weight: 700; }
.buy small { display: block; font-size: 11.5px; color: var(--dim); font-weight: 500; }
.buy b { font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--gold); flex: none; }
.buy:disabled { opacity: .45; cursor: default; }
/* 投資の段階。5つの目盛りで今の段を見せる */
.inv { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 900; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips b { width: 9px; height: 9px; border: 1.5px solid var(--gold); background: transparent; transform: rotate(45deg); }
.pips b.on { background: var(--gold); }
.buy small.next { color: var(--ink); font-weight: 700; }
/* 商品の分野。同じ色がそろうとよく売れる */
.genre { display: inline-block; margin-left: 6px; padding: 0 6px; font-style: normal; font-size: 11px; font-weight: 900; line-height: 1.6; vertical-align: 1px; color: var(--night); background: #7fd1ff; }
.genre.g1 { background: #ffb36b; }
.genre.g2 { background: #b99bff; }
.cb .genre { justify-self: start; margin-left: 0; }
.shelf li.grp { background: transparent; padding: 6px 2px 0; }
.shelf li.grp .genre { margin-left: 0; }
.shelf li.grp em { font-size: 12px; color: var(--gold); }
.money { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.money span { display: grid; gap: 1px; background: var(--panel2); padding: 5px 10px; font-size: 11.5px; color: var(--dim); }
.money b { font-family: var(--num); font-weight: 700; font-size: 18px; color: var(--ink); }
.money small { font-size: 11.5px; font-weight: 700; color: var(--dim); }

  const s = v >= 10000 ? `${+(v / 10000).toFixed(2)}億` : `${v.toLocaleString('ja-JP')}万`;

function shuffle(a, r) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const newPlayer = (name, ai) => ({ name, ai, at: 0, laps: 0, year: 0, power: 1, trade: 'food', form: 'solo', capital: 0, cash: 0, later: 0, sales: 0, fix: 0, fame: 0, mood: 1, wind: false, goods: [], gear: [], burns: [], cutNow: 1, loans: [], equity: 0, hand: [], sum: 1, aim: 0, shield: false, guard: false, double: false, cheap: false, taxed: 0, shorted: 0, level: { site: 0, ad: 0, train: 0, lab: 0 } });

// 山札。場所の決まった札を先に使う
function decksFor(r) {
  const decks = {};
  const test = { sell: t => t.kind === 'sell' && t.rate === 2, sell3: t => t.kind === 'sell' && t.rate === 3, jackpot: t => t.kind === 'sell' && t.rate >= 5, crash: t => t.kind === 'lose' && t.fx.big, lose: t => t.kind === 'lose' && !t.fx.big };
  return (key, zone) => {
    const id = `${key}.${zone}`;
    if (!decks[id]) {
      const all = TILES.filter(test[key] || (t => t.kind === key)), near = all.filter(t => t.zone === zone);
      decks[id] = { list: shuffle(near.length ? near : all, r), i: 0 };
    }
    const d = decks[id];
    return d.list[d.i++ % d.list.length];
  };
}
// 盤をつくる。ノードは次のノードの番号を持ち、分かれ道では次が3つになる
function buildBoard(r) {
  const nodes = [], draw = decksFor(r);
  const add = (tile, u, zone, lane = 0, bulge = 0, key = '', group = '', way = null) => { nodes.push({ i: nodes.length, tile, u, zone, lane, bulge, key, group, way, next: [], fork: -1 }); return nodes.length - 1; };
  let tails = [add(HQ, 0, 'cash')], u = 1;
  for (const [n, part] of ROUTE.entries()) {
    if (part.fork === undefined) {
      for (const key of shuffle([...part.tiles], r)) {
        const id = add(draw(key, part.zone), u++, part.zone, 0, 0, key, `${n}`);
        tails.forEach(t => nodes[t].next.push(id));
        tails = [id];
      }
    } else {
      const from = tails[0], ends = [];
      nodes[from].fork = part.fork;
      FORKS[part.fork].lanes.forEach((lane, k) => {
        let last = from;
        shuffle([...lane.pack], r).forEach((key, j) => {
          const id = add(draw(key, part.zone), u + j, part.zone, k, Math.sin(Math.PI * (j + 1) / (lane.pack.length + 1)), key, `${n}.${k}`, [part.fork, k]);
          nodes[last].next.push(id);
          last = id;
        });
        ends.push(last);
      });
      tails = ends;
      u += FORKS[part.fork].lanes[0].pack.length;
    }
  }
  tails.forEach(t => nodes[t].next.push(0));
  return nodes;
}

// 新しい年。道の形はそのままで、同じ区間の中でマスを並べ替えて中身を引き直す
function redeal(g, r) {
  const draw = decksFor(r), groups = {};
  g.nodes.forEach(n => { if (n.key) (groups[n.group] = groups[n.group] || []).push(n); });
  for (const list of Object.values(groups)) {
    const keys = shuffle(list.map(n => n.key), r);
    list.forEach((n, k) => { n.key = keys[k]; n.tile = draw(n.key, n.zone); });
  }
}

function newGame(r, names = ['プレイヤー1', 'プレイヤー2', 'プレイヤー3', 'プレイヤー4']) {
  const storms = shuffle([...WORLD], r).slice(0, CFG.ALARM.length).map((tile, i) => ({ at: CFG.ALARM[i], tile }));
  const keys = Object.keys(CLIMATE), climates = ['flat', ...Array.from({ length: CFG.YEARS - 1 }, () => keys[Math.floor(r() * keys.length)])];
  return { nodes: buildBoard(r), turn: 0, players: names.map((n, i) => newPlayer(n, i > 0)), storms, climates, pest: null, claimer: null, history: [] };
}

// 開業。自己資金は全社同じ。業種と会社の種類が決まり、最初の商品を持って始まる。いくら借りるかはこのあと選ぶ
function found(p, trade, form) {
  p.trade = trade; p.form = form; p.capital = CFG.SEED;

}

const yearNow = g => Math.min(CFG.YEARS - 1, Math.floor(g.turn / CFG.PER_YEAR));
// その年の何ターン目か。季節は2ターンずつ

const seasonNow = g => Math.floor(turnOf(g) / (CFG.PER_YEAR / CFG.SEASONS));
const isYearEnd = g => turnOf(g) === CFG.PER_YEAR - 1;
const isMidYear = g => turnOf(g) === CFG.PER_YEAR / 2;
// 半年たつと、商品と設備が半年ぶん歳をとる。売れ行きが変わる
function midYear(g) { g.players.forEach(p => { p.goods.forEach(x => { x.age += 1; }); p.gear.forEach(x => { x.age += 1; }); }); }

const scaleOf = p => YEAR[p.year];

const stormNext = g => g.storms.find(x => x.at >= g.turn && x.at - g.turn <= CFG.WARN) || null;
const stormNow = g => g.storms.find(x => x.at === g.turn) || null;

// 商品の今の勢い
const lifeOf = (p, item) => { const l = TRADES[p.trade].life; return l[Math.min(item.age, l.length - 1)]; };
function stageOf(p, item) {
  const l = TRADES[p.trade].life, a = Math.min(item.age, l.length - 1), top = l.indexOf(Math.max(...l));
  if (a === 0) return STAGES[0];
  if (a < top) return STAGES[1];
  if (a === top) return STAGES[2];
  return l[a] >= .75 ? STAGES[3] : STAGES[4];
}
const windOf = p => (p.wind ? CFG.TAIL : 1);
// 同時に出せる商品の数。設備で増える
const shelfOf = p => CFG.SHELF + p.level.site;
// 研究開発の段で、商品の売上が何倍になるか
const labOf = p => 1 + (p.level.lab ? INVEST.lab.steps[p.level.lab - 1].lab : 0);
// 同じ分野の商品がいくつ並んでいるかで、その分野の商品が何倍売れるか
const synOf = (list, genre) => 1 + CFG.SYN * Math.max(0, list.filter(x => x.genre === genre).length - 1);
// 差し止められた商品は、次の決算まで売れない
const itemPower = (p, item, list = p.goods) => (item.stop ? 0 : item.pw * lifeOf(p, item) * TRADES[p.trade].rate * synOf(list, item.genre) * labOf(p));
const goodsPower = (p, list = p.goods) => list.reduce((n, x) => n + itemPower(p, x, list), 0);
// 1マス進むと入る売上。商品の合計に評判を足し、追い風や景気を掛ける
const powerOf = p => tenth((goodsPower(p) + p.fame * TRADES[p.trade].rate) * windOf(p) * p.mood);

const VALUE = [.8, .8, .6, .4, .2];
const bookOf = x => x.price * VALUE[Math.min(x.age, VALUE.length - 1)];
const goodsValue = p => [...p.goods, ...p.gear].reduce((n, x) => n + bookOf(x), 0);
const debtOf = p => p.loans.reduce((n, l) => n + l.left, 0);
// 宣伝・人材・研究開発は、段を上げるほど毎年の費用もかかる
const runOf = p => ['ad', 'train', 'lab'].reduce((n, id) => n + INVEST[id].steps.slice(0, p.level[id]).reduce((m, x) => m + x.run, 0), 0);
const upkeepOf = p => [...p.goods, ...p.gear].reduce((n, x) => n + x.price * CFG.UPKEEP, 0);
// 会社の大きさ。商品と評判から出る1マスの売上(景気や追い風を掛ける前)
const sizeOf = p => goodsPower(p) + p.fame * TRADES[p.trade].rate;
// 人件費は会社が大きくなるほど増える。1マスの売上1につき WAGE ずつ
const wageOf = p => CFG.WAGE * sizeOf(p);
const fixOf = p => p.fix + wageOf(p) + upkeepOf(p) + runOf(p) + FORMS[p.form].upkeep;
const fixParts = p => [['家賃など', p.fix], ['人件費', wageOf(p), '会社が大きいほど増える(1マスの売上に比例)'], ['商品・設備の維持費', upkeepOf(p), `開発費と設備の${Math.round(CFG.UPKEEP * 10)}割`], ['宣伝・人材・研究開発の費用', runOf(p), '投資した段の分'], ['会社の維持費', FORMS[p.form].upkeep, FORMS[p.form].name]];
const repayOf = p => p.loans.reduce((n, l) => n + Math.min(l.left, l.per), 0);
const interestOf = p => p.loans.reduce((n, l) => n + (l.free ? 0 : l.left * (l.rate ?? CFG.RATE)), 0);
const worth = p => p.cash + p.later + goodsValue(p) - debtOf(p);
const rank = g => [...g.players].sort((a, b) => worth(b) - worth(a));

// 全社の平均資産。分かれ道や支援金の得はこれに合わせる。下位の会社ほど大きく効き、後半でも逆転の手になる
const avgWorth = g => g.players.reduce((n, q) => n + Math.max(0, worth(q)), 0) / g.players.length;
const avgOf = (g, p, n) => tenth(Math.max(n * scaleOf(p), avgWorth(g) * n / 100));
// トラブルの出費。総資産(借金を引く前)の n% と、年の大きさに合わせた額の大きいほう。後半でも、借りて大きくした会社でも同じくらい痛い
const grossOf = p => p.cash + p.later + goodsValue(p);
const hurtOf = (p, n) => tenth(Math.max(n * scaleOf(p), Math.max(0, grossOf(p)) * n / 100));
// 足りない分は銀行がつなぐ。少し上乗せして翌年から返す。bridge に足りなかった額を残し、あとで商品を売って埋められるようにする
function pay(p, n) {
  if (n <= 0) return 0;
  if (p.cash >= n) { p.cash -= n; return 0; }
  const short = n - p.cash, left = short * CFG.BRIDGE;
  p.cash = 0; p.shorted += 1;
  p.loans.push({ left, per: left / 2, bridge: short });
  return short;
}
// 商品は今の価値で売れる。売った額だけ立て替えが減り、その分の上乗せもなくなる
const saleOf = bookOf;
function sellToCover(p, loan, k) {
  const v = saleOf(p.goods[k]), rest = loan.bridge - v;
  p.goods.splice(k, 1);
  if (rest <= .001) { p.loans.splice(p.loans.indexOf(loan), 1); p.cash += -rest; return v; }
  loan.bridge = rest; loan.left = rest * CFG.BRIDGE; loan.per = loan.left / 2;
  return v;
}
function earn(p, n) {
  p.sales += n;
  if (TRADES[p.trade].later) p.later += n; else p.cash += n;
  return n;
}
// 1マス進む。振り返りを通ると一周で、回すほど経験が積み上がる
// とりつくものは2つ。悪徳コンサル(pest)とクレーマー(claimer)。どちらも、ほかの会社のいるマスを通ると相手に移る
// クレーマーがついている間は、進んで入る売上が CLAIM 倍になる。振り返りを通ると離れる
// 分かれ道の先の道を抜けたら exit に道を入れる。効果は passLane で当てはめる
const claimOf = (g, who) => (g.claimer === who ? CFG.CLAIM : 1);
function stepTo(g, who, to) {
  const p = g.players[who], out = { gain: 0, handed: -1, claimed: -1, freed: false, lap: 0, exit: null }, from = g.nodes[p.at];
  if (from.way && !g.nodes[to].way) out.exit = from.way;
  p.at = to;
  out.gain = earn(p, tenth(powerOf(p) * claimOf(g, who) * (p.cutNow ?? 1)));
  if (to === 0) { p.laps += 1; out.lap = CFG.LAP * scaleOf(p); p.fame += out.lap; }
  const other = g.players.findIndex((q, i) => i !== who && q.at === to);
  if (g.pest === who && other >= 0) { g.pest = other; out.handed = other; }
  if (g.claimer === who) {
    if (to === 0) { g.claimer = null; out.freed = true; } else if (other >= 0) { g.claimer = other; out.claimed = other; }
  }
  return out;
}
// n マス進むと入る売上の見込み。振り返りの通過も数える。分かれ道の先は選ぶ道で変わるので rough を立てる
function forecast(g, who, n) {
  const sim = { ...g, players: JSON.parse(JSON.stringify(g.players)) }, p = sim.players[who];
  let sum = 0, rough = false;
  for (let k = 0; k < n; k++) {
    const node = nodeOf(sim, p);
    rough = rough || node.next.length > 1;
    sum += stepTo(sim, who, node.next[0]).gain;
  }
  return { sum, rough };
}
// 道を抜けたときの効果。攻める道はサイコロで勝負する
function passLane(g, who, way, roll) {
  const lane = FORKS[way[0]].lanes[way[1]];
  return { lane, ...applyFx(g.players[who], lane.pass, roll, { g, who }) };
}
// 分かれ道を選ぶ。どの道も損はしない。景気に合う道なら追い風が吹いてボーナスが入る
const windLane = g => climateOf(g).lane;
function chooseLane(g, p, node, lane) {
  const fork = FORKS[node.fork], ok = fork.lanes[lane].id === windLane(g);
  p.wind = ok;
  if (!ok) return { ok, bonus: 0 };
  const bonus = CFG.MATCH * scaleOf(p);
  p.cash += bonus;
  return { ok, bonus };
}

// 借りられる額。会社の形で信用が違う
// 開業のときに借りられる上限。会社の種類で違う
const openLimit = form => FORMS[form].credit * CFG.LOAN * CFG.START;
const loanLimit = p => FORMS[p.form].credit * CFG.LOAN * scaleOf(p) * 2;
const loanOffer = p => Math.max(0, Math.floor(Math.min(FORMS[p.form].credit * CFG.LOAN * scaleOf(p), loanLimit(p) - debtOf(p))));
function borrow(p, amount, free = false, rate = CFG.RATE) {
  p.cash += amount;
  p.loans.push({ left: amount, per: amount / CFG.REPAY, free, rate });
}
// 開業の借入の金利。上限に近いほど、銀行は危ないとみて金利を上げる
const openRate = (form, n) => { const [lo, hi] = CFG.OPEN_RATE, k = n / openLimit(form); return tenth((lo + (hi - lo) * k) * 1000) / 1000; };
const grantOf = p => CFG.GRANT * scaleOf(p);
const equityOf = p => CFG.EQUITY * scaleOf(p);
function takeEquity(p) { const n = equityOf(p); p.cash += n; p.equity += n; return n; }

const priceOf = (p, item, off = 1) => item.price * off * (p.cheap ? .5 : 1);
const offerOf = (p, name, tier) => judge(p, { name, tier, price: TIER[tier].price * TRADES[p.trade].price, genre: genreOf(p.trade, name) });
// 今開発できる商品。年が進むほど大きな商品が出る。小さい商品も分野をそろえるために出る
function goodsOffers(p, r) {
  const top = Math.min(5, 2 + p.year), own = new Set(p.goods.map(x => x.name)), list = [];
  for (let t = 1; t <= top; t++) GOODS[p.trade][t].forEach(name => { if (!own.has(name)) list.push(offerOf(p, name, t)); });
  const out = [];
  while (out.length < 3 && list.length) {
    const w = list.map(x => (x.tier >= top - 1 ? 3 : 1)), total = w.reduce((a, b) => a + b, 0);
    let k = 0, v = r() * total;
    while (v >= w[k]) v -= w[k++];
    out.push(...list.splice(k, 1));
  }
  // 全部が投資不足で作れないときは、作れるものを1つ混ぜる
  const can = list.filter(x => x.ok);
  if (out.length && !out.some(x => x.ok) && can.length) out[out.length - 1] = can[Math.floor(r() * can.length)];
  return out.sort((a, b) => a.price - b.price);
}
// 開発する。棚がいっぱいなら1つやめて、今の価値で手放す
function buy(p, item, off = 1, drop = -1) {
  let sold = 0;
  if (drop >= 0) { sold = saleOf(p.goods[drop]); p.cash += sold; p.goods.splice(drop, 1); }
  pay(p, priceOf(p, item, off));
  p.cheap = false;
  p.goods.push({ name: item.name, tier: item.tier, price: item.price, pw: item.pw, genre: item.genre, age: 0 });
  return sold;
}
// k 番目の商品をやめたら、1マスの売上がどれだけ減るか。分野のまとまりが崩れる分も入る
const lossOf = (p, k) => goodsPower(p) - goodsPower(p, p.goods.filter((_, i) => i !== k));
const weakest = p => p.goods.reduce((best, _, k) => (lossOf(p, k) < lossOf(p, best) ? k : best), 0);
const shelfFull = p => p.goods.length >= shelfOf(p);
const peakAge = p => TRADES[p.trade].life.indexOf(Math.max(...TRADES[p.trade].life));
// 新しい商品を加えたとき、売れ筋のころに1マスの売上がどれだけ増えるかの見込み
function gainIf(p, item, drop = -1) {
  const list = p.goods.filter((_, i) => i !== drop), add = { ...item, age: peakAge(p) };
  return goodsPower(p, [...list, add]) - goodsPower(p);
}
function refresh(p) {
  const list = p.goods;
  if (!list.length) return null;
  const peak = TRADES[p.trade].life.indexOf(Math.max(...TRADES[p.trade].life));
  const old = list.reduce((a, b) => (b.age > a.age ? b : a));
  old.age = peak;
  return old;
}

// 効果を当てはめる。カードをもらう分は枚数だけ返し、選ぶのは呼び手に任せる。rival は自分以外でいちばん資産の多い会社に効く
function applyFx(p, fx, roll = 0, ctx = null) {
  if (fx.bet) {
    const win = roll >= fx.bet.need;
    return { ...applyFx(p, win ? fx.bet.hi : fx.bet.lo, 0, ctx), win, roll };
  }
  const k = scaleOf(p), out = { card: fx.card || 0 };
  if (fx.avg && ctx) { out.amount = avgOf(ctx.g, p, fx.avg); p.cash += out.amount; }
  if (fx.now > 0) p.cash += fx.now * k;
  if (fx.now < 0) pay(p, -fx.now * k);
  if (fx.loss) pay(p, hurtOf(p, fx.loss));
  if (fx.lost) p.later *= fx.lost;
  if (fx.later) p.later += fx.later * k;
  if (fx.fame) p.fame = Math.max(0, p.fame + fx.fame * k);
  if (fx.fix) p.fix = Math.max(1, p.fix + fx.fix * k);
  if (fx.mood) p.mood *= fx.mood;
  if (fx.dice) p.sum = Math.max(p.sum, fx.dice);
  if (fx.cheap) p.cheap = true;
  if (fx.burn) p.burns.push({ ...fx.burn });
  if (fx.power) raisePower(p, fx.power);
  if (fx.fresh) out.item = refresh(p);
  if (fx.rival && ctx) out.hit = attack(ctx.g, ctx.who, topOther(ctx.g, ctx.who), fx.rival.kind, fx.rival.n);
  return out;
}
const RIVAL_TEXT = {

// 営業力。営業活動と広報活動のマスの売上と、商品開発マスの値引きに効く
const sellRate = p => tenth(1 + (p.power - 1) * CFG.POWER_UP);
const devOff = p => CFG.TILE_OFF - (p.power - 1) * CFG.DEV_UP;
const raisePower = (p, n = 1) => { p.power = Math.min(CFG.POWER_MAX, p.power + n); };
// 広報は伝える人がいないと半分しか効かない
const prRate = (p, t) => (t.pr && !p.level.train ? CFG.PR_CUT : 1);
function sellTile(p, t) {
  const n = tenth(powerOf(p) * t.rate * sellRate(p) * prRate(p, t));
  earn(p, n);
  if (!t.pr) raisePower(p);
  return n;
}
// 出費のマス。保険に入っていれば1回なかったことになる
function loseTile(p, t) {
  if (p.shield) { p.shield = false; return { safe: true }; }
  applyFx(p, t.fx);
  return { safe: false };
}
// 世の中の動きの増減。by は資産に対する%で、年の大きさに合わせた額を下限にする
const worldAmount = (p, tile) => Math.sign(tile.by[p.trade]) * hurtOf(p, Math.abs(tile.by[p.trade]));
function worldHit(p, tile, side = 'up') {
  if (tile.price) {
    const k = scaleOf(p), cut = debtOf(p) * (1 - tile.debt);
    p.loans.forEach(l => { l.left *= tile.debt; l.per *= tile.debt; });
    p.fix += tile.fix * k;
    applyFx(p, PRICE[side].fx);
    return { text:`${PRICE[side].label} ・ 固定費 +${yen(tile.fix * k)}${cut > .04 ? ` ・ 借金 -${yen(cut)}` : ''}`, amount: -1 };
  }
  if (tile.debt) {
    const before = debtOf(p);
    p.loans.forEach(l => { l.left *= tile.debt; l.per *= tile.debt; });
    return { text: before ? `借金 ${tile.debt > 1 ? '+' : ''}${yen(debtOf(p) - before)}` : '借金がないので影響なし' };
  }
  const n = worldAmount(p, tile);
  if (n < 0 && p.shield) { p.shield = false; return { text:'保険で守られた', safe:true }; }
  if (n > 0) p.cash += n; else pay(p, -n);
  return { text: n ? `${n > 0 ? '+' : ''}${yen(n)}` : '影響なし', amount: n };
}

function taxOf(form, profit) {
  if (profit <= 0) return 0;
  if (form !== 'solo') return profit * .25;
  return Math.min(profit, 20) * .1 + Math.max(0, Math.min(profit, 60) - 20) * .3 + Math.max(0, profit - 60) * .45;
}
// 決算。今年の利益を計算して税金を払い、商品が1年ぶん歳をとる
function settle(p) {
  const t = TRADES[p.trade], stock = t.stock ? powerOf(p) * t.stock : 0;
  const fix = fixOf(p), interest = interestOf(p), sale = p.sales + stock;
  let profit = sale - fix - interest;
  const bonus = p.double && profit > 0 ? profit : 0;
  profit += bonus;
  const tax = taxOf(p.form, profit), dividend = p.equity * CFG.DIVIDEND;
  const lines = [{ label:'今年の売上', amount: sale, kind:'pl' }, { label:'固定費', amount: -fix, kind:'pl' }];
  if (interest) lines.push({ label:'借金の利息', amount: -interest, kind:'pl' });
  if (bonus) lines.push({ label:'ボーナス決算', amount: bonus, kind:'pl' });
  lines.push({ label:'税金', amount: -tax, kind:'pl' });
  const collected = p.later;
  p.cash += stock + collected; p.later = 0;
  if (t.stock) lines.push({ label:'月額料金の入金', amount: stock, kind:'cash' });
  if (collected) lines.push({ label:'入金待ちの回収', amount: collected, kind:'cash' });
  const repay = p.loans.reduce((n, l) => n + Math.min(l.left, l.per), 0);
  if (repay) lines.push({ label:'借金の返済', amount: -repay, kind:'cash' });
  if (dividend) lines.push({ label:'出資者への配当', amount: -dividend, kind:'cash' });
  const before = p.shorted, due = [...p.loans];
  pay(p, fix + interest + tax + repay + dividend - bonus);
  due.forEach(l => { l.left -= Math.min(l.left, l.per); });
  p.loans = p.loans.filter(l => l.left > .01);
  p.goods.forEach(x => { x.age += 1; x.stop = false; });
  p.gear.forEach(x => { x.age += 1; });
  p.sales = 0; p.double = false; p.taxed += tax;
  // 個人事業のままだと損をしたときだけ、決算の画面で一言そえる
  const hint = p.form === 'solo' && tax > taxOf('llc', profit) + .5 ? taxOf('llc', profit) : 0;
  return { lines, profit: profit - tax, short: p.shorted > before, hint };
}

// 年末は全社が同時に決算する。最下位の会社には支援金が入り、1位の会社に悪徳コンサルかクレーマーがつく
function closeYear(g) {
  const list = g.players.map(settle), order = rank(g), last = order[order.length - 1], k = YEAR[yearNow(g)], y = yearNow(g);
  const res = { list, aid: 0, low: -1, pest: -1, claimer: -1 };
  if (worth(last) < worth(order[0])) { res.aid = tenth(Math.max(CFG.AID * k, avgWorth(g) * CFG.AID_RATE)); res.low = whoIs(g, last); last.cash += res.aid; }
  // どちらも1年で帰る。奇数年の終わりには悪徳コンサル、偶数年の終わりにはクレーマーが1位の会社へ来る
  g.pest = null; g.claimer = null;
  if (y < CFG.YEARS - 1) {
    if (y % 2 === 1) { res.pest = whoIs(g, order[0]); g.pest = res.pest; } else { res.claimer = whoIs(g, order[0]); g.claimer = res.claimer; }
  }
  g.history.push(g.players.map(worth));
  return res;
}

// 5年後の経営者レベル判定。本の言葉の問題の正解数でレベルが決まり、資産が増減する
// 早押しで取った問題の数で、経営者レベルが決まる。増減は自分の資産に対する割合
const LEVELS = [
  { min:3, name:'名経営者', rate:.5 },
  { min:2, name:'敏腕経営者', rate:.2 },
  { min:1, name:'一人前の経営者', rate:0 },

const QUIZ = 6, QUIZ_SEC = 15;
const levelOf = score => LEVELS.find(l => score >= l.min);
// レベルに応じたボーナス。資産がマイナスのときは増減しない。赤点で現金が足りない分は借金になる
function levelBonus(p, score) {
  const n = tenth(Math.max(0, worth(p)) * levelOf(score).rate), short = Math.max(0, -n - p.cash);
  p.cash = Math.max(0, p.cash + n);
  if (short) p.loans.push({ left: short, per: short });
  return n;
}
// 早押しで、相手の会社がいつ押して、合っているか。知っている問題ほど早く押す。知らなければ遅く、当てずっぽう
function buzzPlan(skill, choices, r) {
  const know = r() < skill, t = know ? 3.5 + r() * 6 : 7 + r() * 7;
  return { t, ok: know || r() < 1 / choices };
}
// 1問ぶん。いちばん早く正しく押した会社が取る。間違えた会社はその問題はもう押せない。だれも取れなければ -1
function buzzWinner(plans) {
  const hit = plans.filter(x => x.ok && x.t <= QUIZ_SEC).sort((a, b) => a.t - b.t)[0];
  return hit ? hit.i : -1;
}

const cardText = (p, id) => { const f = CARDS[id].fx; return typeof f === 'function' ? f(p) : f; };
const topOther = (g, who) => g.players.map((q, i) => ({ i, v: worth(q) })).filter(x => x.i !== who).sort((a, b) => b.v - a.v)[0].i;
// カードを今使えるか。使えない理由を返す。配るときも同じ判定で外す
function blockOf(g, p, id) {
  if (CARDS[id].act === 'renew' && !p.goods.some(x => stageOf(p, x) === STAGES[3] || stageOf(p, x) === STAGES[4])) return '売れ筋を過ぎた商品がまだない';
  return '';
}
function cardOffers(g, p, r) {
  return shuffle(CARD_IDS.filter(id => !p.hand.includes(id) && !blockOf(g, p, id)), r).slice(0, 3);
}
function give(p, id, drop = -1) {
  if (p.hand.length >= CFG.HAND) p.hand.splice(Math.max(0, drop), 1);
  p.hand.push(id);
}
// 他社への妨害。相手が守りを固めていれば1回はね返される
function attack(g, who, to, kind, n) {
  const p = g.players[who], q = g.players[to];
  if (q.guard) { q.guard = false; return { to, kind, blocked: true }; }
  if (kind === 'cut') { q.mood *= n; return { to, kind, n }; }
  if (kind === 'poach') { const k = Math.max(0, Math.min(n, q.power - 1)); q.power -= k; raisePower(p, k); return { to, kind, power: k }; }
  if (kind === 'steal') { const v = tenth(powerOf(q) * n); pay(q, v); p.cash += v; return { to, kind, amount: v }; }
  if (kind === 'sue') {
    const list = q.goods.filter(x => !x.stop);
    if (!list.length) return { to, kind, none: true };
    const x = list.reduce((a, b) => (itemPower(q, b) > itemPower(q, a) ? b : a));
    x.stop = true;
    return { to, kind, item: x.name };
  }
  if (kind === 'down') {
    const ids = ['ad', 'train', 'lab'].filter(id => q.level[id] > 0);
    if (!ids.length) return { to, kind, none: true };
    const id = ids.reduce((a, b) => (q.level[b] > q.level[a] ? b : a));
    return { to, kind, ...lower(q, id) };
  }
  if (kind === 'site') {
    if (!q.level.site) return { to, kind, none: true };
    return { to, kind, ...lower(q, 'site') };
  }
  return { to, kind };
}
// 投資を1段下げる。その段で得た効き目もなくなる。設備なら棚が減り、あふれた商品は今の価値で手放す
function lower(q, id) {
  const lv = q.level[id], x = INVEST[id].steps[lv - 1], out = { id, label: INVEST[id].label, lv: lv - 1, sold: [] };
  q.level[id] = lv - 1;
  if (x.fame) q.fame = Math.max(0, q.fame - x.fame);
  if (x.power) q.power = Math.max(1, q.power - x.power);
  if (id === 'site') {
    q.gear.pop();
    while (q.goods.length > shelfOf(q)) { const k = weakest(q); out.sold.push(q.goods[k].name); q.cash += saleOf(q.goods[k]); q.goods.splice(k, 1); }
  }
  return out;
}
function useCard(g, who, id, opt) {
  const p = g.players[who], c = CARDS[id];
  p.hand.splice(p.hand.indexOf(id), 1);
  switch (c.act) {
    case 'dice': p.sum = Math.max(p.sum, c.n); return {};
    case 'aim': p.aim = opt; return {};
    case 'mood': p.mood *= c.k; return {};
    case 'deal': return { amount: earn(p, powerOf(p) * c.n) };
    case 'double': p.double = true; return {};
    case 'cheap': p.cheap = true; return {};
    case 'renew': return { item: refresh(p) };
    case 'grant': { const n = c.n * scaleOf(p); p.cash += n; return { amount: n }; }
    case 'shield': p.shield = true; return {};
    case 'ally': { const n = powerOf(g.players[topOther(g, who)]) * c.n; p.cash += n; return { amount: n }; }
    case 'hit': return { hit: attack(g, who, opt, c.hit, c.n) };
    case 'guard': p.guard = true; return {};
  }
  return {};
}

// マスの見出しは経営の活動の分類。その下に効果を添える
const TILE_LABEL = { hq:'振り返り', lose:'トラブル', card:'情報収集', desk:'経営相談', fund:'資金調達', goods:'商品開発', event:'経営判断', rush:'業務改善' };
function tileLabel(t) {
  if (t.kind === 'sell') return t.pr ? '広報活動' : '営業活動';
  if (t.kind === 'lose' && t.fx.big) return '大トラブル';
  return TILE_LABEL[t.kind];
}
function tileEffect(t) {
  switch (t.kind) {
    case 'hq': return 'カード1枚';
    case 'sell': return `${t.rate}マス分の売上`;
    case 'lose': return t.fx.burn ? `${t.fx.burn.turns}ターン続く` : t.fx.loss ? `資産の${t.fx.loss}%を失う` : '売上ダウン';
    case 'card': return 'カード1枚';
    case 'desk': return 'カード2枚';
    case 'fund': return { bank:'借りられる', soft:'利息なしで借りる', grant:'補助金に申請', equity:'出資を受ける' }[t.fund];
    case 'goods': return '新商品を始める';
    case 'event': return '2択で決める';
    case 'rush': return `サイコロ${t.dice}個`;
  }
  return '';
}
const tileChip = t => (t.kind === 'sell' ? `${tileLabel(t)}×${t.rate}` : tileLabel(t));

const YEAR_STEPS = CFG.PER_YEAR * 4.5;
// 売上が増えると人件費も増えるので、手元に残るのはこの割合
const NET = () => Math.max(.2, 1 - CFG.WAGE / YEAR_STEPS);
// 効果の値打ちの目安。自動プレイの判断に使う
function valueOf(p, fx) {
  if (fx.bet) return (valueOf(p, fx.bet.hi) + valueOf(p, fx.bet.lo)) / 2;
  const k = scaleOf(p), years = CFG.YEARS - p.year;
  let v = (fx.now || 0) * k + (fx.later || 0) * k - (fx.loss ? hurtOf(p, fx.loss) : 0);
  v += (fx.fame || 0) * k * years * YEAR_STEPS * .8;
  v -= (fx.fix || 0) * k * years;
  if (fx.mood) v += (fx.mood - 1) * powerOf(p) * 7;
  if (fx.card) v += fx.card * 2 * k;
  if (fx.dice) v += k;
  if (fx.cheap) v += 4 * k;
  if (fx.power) v += fx.power * 3 * k;
  if (fx.fresh) v += powerOf(p) * 6;
  if (fx.avg) v += fx.avg * k * 4;
  if (fx.rival) v += { steal: fx.rival.n * powerOf(p), poach: fx.rival.n * 3 * k, cut: 4 * k }[fx.rival.kind];
  return v;
}
// n マス先のノード。途中に分かれ道があれば見通せない
function ahead(g, p, n) {
  let node = nodeOf(g, p);
  for (let i = 0; i < n; i++) {
    if (node.next.length > 1) return null;
    node = g.nodes[node.next[0]];
  }
  return node;
}

// 投資1段で、1年あたりどれだけ得をするかの見込み。毎年の費用を引いた残り。1年で進むマスの目安は YEAR_STEPS

function investGain(p, id, offers = []) {
  const x = stepOf(p, id);
  if (!x) return -Infinity;
  const rate = TRADES[p.trade].rate * p.mood;
  if (id === 'ad') return x.fame * rate * YEAR_STEPS * NET() - x.run;
  if (id === 'lab') return goodsPower(p) * (x.lab - (labOf(p) - 1)) / labOf(p) * p.mood * YEAR_STEPS * NET() - x.run;
  if (id === 'train') return powerOf(p) * CFG.POWER_UP * x.power * CFG.PER_YEAR * 1.2 + (p.power + x.power > CFG.POWER_MAX ? -99 : 0) - x.run;
  // 設備は空いた棚に商品を置けるときだけ得になる。棚がもうすぐ埋まるなら半分の値打ち
  const room = shelfOf(p) - p.goods.length;
  if (room > 1 || !offers.length) return -x.price * CFG.UPKEEP;
  const best = Math.max(...offers.filter(o => o.ok).map(o => gainIf(p, o)), 0);
  return best * p.mood * YEAR_STEPS * NET() * (room ? .35 : .7) - x.price * CFG.UPKEEP;
}

// 自動プレイの頭。ライバルも計測用の人形もこれを使う
// tax 税金が重くなったら法人にする / always いつも同じ種類の道 / wind 景気に合う道を選ぶ / half 半分は合わせる / anti わざと外す / cards カードの使いどころが分かる / money 買い物と借金がうまい / plan 決断がうまい / random でたらめ / nobuy 商品を買わない
// invest: all 買えるだけ全部 / none 投資しない / only 決めた種類だけ(focus) / なし ときどき気まぐれに
function brain(b, r) {
  const coin = n => r() < n;
  // 商品は画面に増え方が出るので、でたらめな人以外は増えるものを選ぶ。money は投資と借入もうまい
  const shopper = !b.random, investor = b.money || b.investor;
  const tileWorth = (g, p, node) => {
    const t = node.tile;
    return { sell: (t.rate || 0) * 2, goods: 5, card: 3, desk: 5, fund: 2, event: 3, rush: 2, hq: 3, lose: t.fx?.big ? -9 : -5 }[t.kind] ?? 0;
  };
  const left = p => CFG.YEARS - p.year;
  const others = (g, p) => g.players.map((_, i) => i).filter(i => g.players[i] !== p);
  return {
    lane(g, p, node) {
      const lanes = FORKS[node.fork].lanes, any = () => Math.floor(r() * lanes.length), match = lanes.findIndex(l => l.id === windLane(g));
      if (b.always) return lanes.findIndex(l => l.id === b.always);
      if (b.anti) { const rest = [0, 1, 2].filter(i => i !== match); return rest[Math.floor(r() * rest.length)]; }
      if (b.random) return any();
      if (b.wind) return match;
      if (b.half) return coin(.5) ? match : any();
      return any();
    },
    pick(g, p, t) {
      if (b.plan) return valueOf(p, t.a.fx) >= valueOf(p, t.b.fx) ? 'a' : 'b';
      return coin(.5) ? 'a' : 'b';
    },
    // 開発する商品を選ぶ。開発しないなら null
    shop(g, p, list, off = 1) {
      if (b.nobuy || !list.length) return null;
      const can = list.filter(x => x.ok && priceOf(p, x, off) <= p.cash);
      if (!can.length) return null;
      if (b.random) return coin(.5) ? can[Math.floor(r() * can.length)] : null;
      if (shopper && (b.money || coin(.8))) {
        const score = x => gainIf(p, x, shelfFull(p) ? this.drop(g, p, x) : -1) * YEAR_STEPS * NET() * Math.min(3, left(p)) * .6 - priceOf(p, x, off) * (1 + CFG.UPKEEP * left(p));
        const best = can.reduce((a, x) => (score(x) > score(a) ? x : a));
        return score(best) > 0 ? best : null;
      }
      return null;
    },
    // 棚がいっぱいのとき、どれをやめるか。うまい人は分野のまとまりまで見る
    drop(g, p, item) {
      if (!shopper || !item) return weakest(p);
      const add = { ...item, age: 0 };
      return p.goods.reduce((best, _, k) => (goodsPower(p, [...p.goods.filter((_, i) => i !== k), add]) > goodsPower(p, [...p.goods.filter((_, i) => i !== best), add]) ? k : best), 0);
    },
    // 開業資金を、借りられる額のどれだけ借りるか
    openLoan() { return b.loan !== undefined ? b.loan : [0, .25, .5, .75, 1][Math.floor(r() * 5)]; },
    openBuy(g, p) {
      if (b.invest === 'none' || b.nobuy) return [];
      if (b.invest === 'all') return Object.keys(INVEST);
      if (b.invest === 'only') return b.focus;
      if (investor) return ['site'];
      return Object.keys(INVEST).filter(() => coin(.35));
    },
    openGoods(g, p, list) {
      if (b.nobuy) return [];
      if (shopper || b.invest === 'all') return [...list].reverse();
      return list.filter(() => coin(.5));
    },
    wantLoan(g, p, list) {
      const n = loanOffer(p);
      if (!n || b.nobuy) return false;
      if (b.random) return coin(.3);
      if (b.money) return list.some(x => priceOf(p, x) > p.cash && priceOf(p, x) <= p.cash + n) && p.year < CFG.YEARS - 2;
      return coin(.15);
    },
    // 投資するか。全部の人は買えるだけ、うまい人は元が取れるものだけ
    wantUp(g, p, id, x, offers) {
      if (b.invest === 'none' || b.noup || b.nobuy) return false;
      if (x.price > p.cash) return false;
      if (b.invest === 'all') return true;
      if (b.invest === 'only') return b.focus.includes(id) && x.price <= p.cash * .7;
      if (b.random) return coin(.35);
      // investor が数なら、その割合だけ考えて投資する
      if (investor && (typeof b.investor !== 'number' || coin(b.investor))) return x.price <= p.cash * .7 && investGain(p, id, offers) * Math.min(4, left(p) - 1) > x.price * (id === 'site' ? .5 : 1);
      return coin(.35) && x.price <= p.cash * .4;
    },
    wantFund(g, p) { return b.random ? coin(.5) : b.money ? p.year < CFG.YEARS - 2 : coin(.5); },
    form(g, p) {
      if (b.random) return null;
      if (p.form === 'solo' && (b.money || b.tax ? p.taxed > 2 : coin(.2)) && p.cash > 4) return 'llc';
      return null;
    },
    card(g, p, offers) {
      if (b.nocard || !offers.length) return null;
      return offers[Math.floor(r() * offers.length)];
    },
    // サイコロの前に使うカード。妨害は自分より資産の多い会社を狙う
    act(g, p) {
      const season = seasonNow(g), who = whoIs(g, p), rest = others(g, p);
      for (const id of p.hand) {
        const c = CARDS[id];
        if (blockOf(g, p, id)) continue;
        if (!b.cards) { if (coin(.3)) return { id, opt: c.act === 'hit' ? rest[Math.floor(r() * rest.length)] : 1 + Math.floor(r() * 6) }; continue; }
        if (c.act === 'dice') return { id };
        if (c.act === 'aim') {
          let best = 0, top = 3;
          for (let n = 1; n <= 6; n++) { const node = ahead(g, p, n); if (node && tileWorth(g, p, node) > top) { top = tileWorth(g, p, node); best = n; } }
          if (best) return { id, opt: best };
        }
        if (c.act === 'hit' && !b.nohit) { const to = topOther(g, who); if (worth(g.players[to]) >= worth(p) * .8) return { id, opt: to }; }
        if (c.act === 'guard' && !p.guard) return { id };
        if (c.act === 'mood' && season === 0) return { id };
        if (c.act === 'deal' && p.year >= 1) return { id };
        if (c.act === 'double' && season === 3) return { id };
        if (c.act === 'cheap' && season === 3) return { id };
        if (c.act === 'renew') return { id };
        if (c.act === 'grant' && p.year >= 2) return { id };
        if (c.act === 'shield' && !p.shield) return { id };
        if (c.act === 'ally' && p.year >= 1) return { id };
      }
      return null;
    },
  };
}

// 自動プレイの年末の準備。会社の種類、投資、借入、開発の順。年の途中(half)は投資だけ
function autoYear(g, p, q, r, half = false) {
  const out = [];
  const f = half ? null : q.form(g, p);
  if (f) { changeForm(p, f); out.push(`${FORMS[f].name}になった`); }
  const list = goodsOffers(p, r);
  for (const id of Object.keys(INVEST)) {
    const x = stepOf(p, id);
    if (x && q.wantUp(g, p, id, x, list)) { out.push(investName(p, id)); invest(p, id); }
  }
  if (half) return out;
  if (q.wantLoan(g, p, list)) borrow(p, loanOffer(p));
  const item = q.shop(g, p, list.map(x => judge(p, x)));
  if (item) {
    buy(p, item, 1, shelfFull(p) ? q.drop(g, p, item) : -1);
    out.push(`${item.name}を開発した`);
  }
  return out;
}
// 自動プレイの開業。借りて、初期投資をして、空いた棚に商品を置く
function autoOpen(g, p, q, r) {
  const k = q.openLoan(), n = tenth(openLimit(p.form) * k), out = [];
  p.start = k;
  if (n) { borrow(p, n, false, openRate(p.form, n)); out.push(`${yen(n)}を借りた`); }
  for (const id of q.openBuy(g, p)) {
    if (stepOf(p, id).price > p.cash) continue;
    out.push(investName(p, id));
    invest(p, id);
  }
  for (const item of q.openGoods(g, p, openOffers(p).filter(x => x.ok))) {
    if (priceOf(p, item) > p.cash || shelfFull(p)) continue;
    buy(p, item);
    out.push(`${item.name}を開発した`);
  }
  return out;
}
function autoCards(g, p, q, n, r) {
  for (let i = 0; i < n; i++) {
    const id = q.card(g, p, cardOffers(g, p, r));
    if (id) give(p, id, 0);
  }
}
// 妨害の結果の短い文
function hitText(g, h) {
  const to = `P${h.to + 1}`;
  if (h.blocked) return `${to}に守られた`;
  if (h.kind === 'cut') return `${to}の売上が下がった`;
  if (h.kind === 'poach') return `${to}から営業力 +${h.power}`;
  if (h.kind === 'steal') return `${to}から +${yen(h.amount)}`;
  if (h.kind === 'sue') return h.none ? `${to}に止める商品がない` : `${to}の${h.item}を止めた`;
  if (h.kind === 'down' || h.kind === 'site') return h.none ? `${to}に下げられる投資がない` : `${to}の${h.label}を${h.lv}段に下げた`;
  return '';
}
// 自動プレイの1回分。戻り値は吹き出しに出す短い文。妨害したら hit に結果が入る
function autoLand(g, p, q, r) {
  const t = nodeOf(g, p).tile, who = whoIs(g, p);
  const note = (text, tone = 'plain', hit = null) => ({ text, tone, t, hit });
  switch (t.kind) {
    case 'hq': autoCards(g, p, q, 1, r); return note('カードを取った');
    case 'sell': return note(`+${yen(sellTile(p, t))}`, 'good');
    case 'lose': {
      const text = fxText(p, t.fx).join('、'), res = loseTile(p, t);
      return res.safe ? note('保険で守られた', 'good') : note(text, 'bad');
    }
    case 'card': autoCards(g, p, q, 1, r); return note('カードを取った');
    case 'desk': if (g.pest === who) g.pest = null; autoCards(g, p, q, 2, r); return note('カードを2枚取った');
    case 'fund': {
      if (t.fund === 'grant') { const n = 1 + Math.floor(r() * 6); if (n >= 3) { p.cash += grantOf(p); return note(`採択 +${yen(grantOf(p))}`, 'good'); } return note('不採択'); }
      if (!q.wantFund(g, p)) return note('見送り');
      if (t.fund === 'equity' && p.form === 'kk') return note(`出資 +${yen(takeEquity(p))}`, 'good');
      const n = loanOffer(p);
      if (!n) return note('見送り');
      borrow(p, n, t.fund === 'soft');
      return note(`${yen(n)}を借りた`);
    }
    case 'goods': {
      const off = devOff(p), item = q.shop(g, p, goodsOffers(p, r), off);
      if (!item) return note('見送り');
      buy(p, item, off, shelfFull(p) ? q.drop(g, p, item) : -1);
      return note(`${item.name}を開発した`, 'good');
    }
    case 'event': {
      const side = q.pick(g, p, t), c = t[side], res = applyFx(p, c.fx, 1 + Math.floor(r() * 6), { g, who });
      autoCards(g, p, q, res.card, r);
      return note(res.hit ? `${choiceOf(t, side, p.trade)} ・ ${hitText(g, res.hit)}` : choiceOf(t, side, p.trade), 'plain', res.hit);
    }
    case 'rush': p.sum = Math.max(p.sum, t.dice); return note(`次はサイコロ${t.dice}個`, 'good');
  }
  return note('');
}
function pestTurn(g, who, r) {
  const e = PEST[Math.floor(r() * PEST.length)], p = g.players[who];
  if (e.none) return { say: e.say, res: {} };
  if (e.card && p.hand.length) { const [id] = p.hand.splice(Math.floor(r() * p.hand.length), 1); return { say: e.say, res: { card: id } }; }
  const n = hurtOf(p, CFG.PEST);
  pay(p, n);
  return { say: e.card ? PEST[0].say : e.say, res: { cash: n } };
}

  ];

    kick();
  }

  // 見せたい幅と奥行きが収まる距離
  function reach(width, depth) {
    const v = Math.tan(camera.fov * Math.PI / 360);
    return Math.max(width / (2 * v * camera.aspect), depth / (2 * v));
  }

  function dispose(o) {
    o.traverse(m => {
      m.geometry?.dispose();
      for (const x of [].concat(m.material || [])) { x.map?.dispose(); x.dispose(); }
    });
  }

  // trade を渡すと、マスの文がその業種の言い方になる
  function build(g, trade = '') {

    tap: () => tone(1100, 0, .035, 'sine', .07),

}

// 相手の番は画面をタップすると早送りできる
function pause(ms) {
  return new Promise(res => {
    const t = setTimeout(done, ms * tempo());
    function done() { clearTimeout(t); skipWait = null; res(); }
    skipWait = done;
  });
}

async function banner(big, small = '', tone = 'good') {

// サイコロのあと、歩き出す前に1マスの売上と合計を見せる。タップで飛ばせる
async function rateBanner(p, steps) {

function shake() {

  const el = $('stage');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

// 入った金額が現金の欄へ飛んでいく
function burst(n, tone = 'gold') {
  if (calm) return;
  const fx = $('fx'), to = $('status').getBoundingClientRect(), box = fx.getBoundingClientRect();
  const sx = box.width / 2, sy = box.height * .42, tx = to.left - box.left + 40, ty = to.top - box.top + 12;
  for (let i = 0; i < Math.min(12, 4 + n / 5); i++) {
    const c = document.createElement('span');
    c.className = `coin ${tone}`;
    fx.append(c);
    const dx = (Math.random() - .5) * 170, dy = -50 - Math.random() * 100;
    c.animate([
      { transform: `translate(${sx}px,${sy}px) scale(.4)` },
      { transform: `translate(${sx + dx}px,${sy + dy}px) scale(1)`, offset: .4 },
      { transform: `translate(${tx}px,${ty}px) scale(.5)` },
    ], { duration: 560 + i * 30, easing: 'cubic-bezier(.3,.6,.4,1)' }).finished.then(() => c.remove(), () => c.remove());
  }
}

function confetti() {
  if (calm) return;
  const fx = $('fx'), w = fx.clientWidth, h = fx.clientHeight;
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('span');
    c.className = 'bit'; c.style.background = CONFETTI[i % CONFETTI.length];
    fx.append(c);
    const x = Math.random() * w, turn = 360 + Math.random() * 720;
    c.animate([
      { transform: `translate(${x}px,-20px) rotate(0)` },
      { transform: `translate(${x + (Math.random() - .5) * 90}px,${h + 20}px) rotate(${turn}deg)` },
    ], { duration: 1500 + Math.random() * 1400, delay: Math.random() * 500, easing: 'cubic-bezier(.3,.3,.6,1)', fill: 'both' }).finished.then(() => c.remove(), () => c.remove());
  }
}

function sheet(html, cls = '') {

const btn = (text, go, on = true, cls = '') => `<button class="btn ${cls}" data-go="${go}"${on ? '' : ' disabled'}>${text}</button>`;
const ghost = (text, go) => `<button class="ghost" data-go="${go}">${text}</button>`;

function heading(t, note = '') {
  const [color] = G.KIND[t.kind];
  return `<div class="top" style="--c:${color}"><span class="effect">${tileLabel(t)}</span><small>${tileEffect(t)}</small><h2>${tileName(t, me().trade)}</h2></div>${note ? `<p class="note">${note}</p>` : ''}`;
}

const cardFace = (p, id) => `<span class="cb"><b>${CARDS[id].name}</b><span class="eff">${cardText(p, id)}</span></span>`;

// 商品の一生の形。今どこにいるかを光らせる
function curve(p, item) {
  const l = TRADES[p.trade].life, top = Math.max(...l), now = item.age === undefined ? -1 : Math.min(item.age, l.length - 1);
  return `<span class="curve">${l.map((k, i) => `<i class="${i === now ? 'on' : ''}" style="height:${k / top * 100}%"></i>`).join('')}</span>`;
}
const peakOf = (p, item) => item.pw * Math.max(...TRADES[p.trade].life) * TRADES[p.trade].rate;

function describe(t) {
  const p = me();
  switch (t.kind) {
    case 'hq': return '通ると一周。やり方を見直して、1マスの売上が増える。止まるとカードを1枚もらえる。';
    case 'sell': return `1マスの売上の${t.rate}倍${sellRate(p) > 1 ? `に、営業力で${sellRate(p)}倍` : ''}${prRate(p, t) < 1 ? '。人材がいないので半分' : ''}。今なら +${yen(powerOf(p) * t.rate * sellRate(p) * prRate(p, t))}。${t.pr ? '' : '止まると営業力 +1。'}`;
    case 'lose': return `${fxText(p, t.fx).join('、')}。保険があれば防げる。`;
    case 'card': return 'カードを1枚もらえる。';
    case 'desk': return 'カードを2枚もらえる。悪徳コンサルも離れる。';
    case 'fund': return { bank:'銀行からお金を借りられる。', soft:'利息なしでお金を借りられる。', grant:'申請して、目が3以上なら返済のいらないお金が入る。', equity:'株式会社なら出資を受けられる。それ以外は銀行で借りられる。' }[t.fund];
    case 'goods': return `新商品を${Math.round((1 - devOff(p)) * 100)}%引きで開発できる。営業力が高いほど安い。`;
    case 'event': return '2つのうち、どちらかを選ぶ。';
    case 'rush': return `次のターン、サイコロ${t.dice}個で進む。`;

  return '';
}

// 会社の数字の控え。何が変わったかを見せるのに使う。true は増えると苦しくなる項目
const FIELDS = [['資産', worth], ['現金', p => p.cash], ['入金待ち', p => p.later], ['商品・設備の価値', goodsValue], ['借金', debtOf, true], ['1マスの売上', powerOf, false, n => perTile(n, yenFull)], ['毎年の固定費', fixOf, true], ['営業力', p => p.power, false, n => `${n}`]];
const snap = p => { tidy(p); return FIELDS.map(([, fn]) => tenth(fn(p))); };
function changes(before, p) {
  const after = snap(p);
  const rows = FIELDS.map(([label, , heavy, show = yenFull], i) => {
    const a = before[i], b = after[i], d = tenth(b - a);
    if (!d) return '';
    return `<li class="${i ? '' : 'hi'}"><span>${label}</span><small>${show(a)} → ${show(b)}</small><b class="${(heavy ? d < 0 : d > 0) ? '' : 'minus'}">${d > 0 ? '+' : ''}${show(d)}</b></li>`;
  }).join('');
  return rows ? `<ul class="chg">${rows}</ul>` : '';
}
// やる前に、やった場合の増減を計算して見せる
function trial(p, fn) {
  const sim = JSON.parse(JSON.stringify(p)), before = snap(sim);
  fn(sim);
  return changes(before, sim);
}

const SHORT = { food: '飲食', fab: '町工場', shop: '小売', tech: 'IT', solo: '個人', llc: '合同', kk: '株式' };

const compareSheet = () => peek(`<h2 class="ask big">全社の比較</h2>${compare()}<p class="sub">Pの札を押すと、その会社の内訳を見られる</p>`);
const genreNo = (p, genre) => Object.keys(GENRES[p.trade]).indexOf(genre);
const genreTag = (p, genre) => `<i class="genre g${genreNo(p, genre)}">${genre}</i>`;
function shelf(p) {

  return groups.map(([k, list]) => `<li class="grp">${genreTag(p, k)}<em>${list.length > 1 ? `${list.length}つそろって ×${synOf(p.goods, k).toFixed(2)}` : '1つ'}</em></li>`

    + (p.level.lab ? `<li><span><b>研究開発</b><small>上の商品の売上に含む</small></span><em>×${labOf(p).toFixed(1)}</em></li>` : '')
    + (p.fame ? `<li><span><b>会社の評判</b><small>宣伝、経営判断、周回で積み上がる</small></span><em>${perTile(p.fame * TRADES[p.trade].rate)}</em></li>` : '')
    + (Math.abs(windOf(p) * p.mood - 1) > .001 ? `<li><span><b>追い風・景気など</b></span><em>×${+(windOf(p) * p.mood).toFixed(2)}</em></li>` : '');
}
// 1社の状況。資産、1マスの売上、固定費を同じ段に並べ、それぞれの内訳を下に置く
function company(i) {
  const p = g.players[i], line = (label, value, note = '') => `<li><span><b>${label}</b>${note ? `<small>${note}</small>` : ''}</span><em>${value}</em></li>`;
  const block = (title, value, about, rows) => `<div class="stat"><h3><span>${title}</span><b>${value}</b></h3><p>${about}</p><ul class="shelf">${rows}</ul></div>`;
  const debt = debtOf(p), later = TRADES[p.trade].later;
  const assets = line('現金', yen(p.cash)) + (later || p.later ? line('入金待ち', yen(p.later), '決算で現金になる') : '') + line('商品・設備の価値', yen(goodsValue(p)), '買値の8割から半年ごとに下がる')
    + line('借金', debt ? yen(-debt) : '0円', debt ? `毎年 ${yen(repayOf(p))} 返す ・ 利息 ${yen(interestOf(p))}` : '');
  const costs = fixParts(p).filter(([, v]) => v > .04).map(([label, v, note]) => line(label, yen(v), note)).join('');
  const hand = p.hand.length ? (i === 0 ? p.hand.map(id => line(CARDS[id].name, '', cardText(p, id))).join('') : line(`${p.hand.length}枚`, '')) : line('なし', '');
  peek(`<div class="who">${badge(i)}<b>${TRADES[p.trade].name}</b><small>${FORMS[p.form].name}</small></div>
    ${block('資産', yen(worth(p)), `${CFG.YEARS}年後、これがいちばん多い会社の勝ち`, assets)}
    ${block('1マスの売上', perTile(powerOf(p)), `1マス進むごとに入る。商品と評判で決まる。商品棚 ${p.goods.length} / ${shelfOf(p)}`, shelf(p))}
    ${block('毎年の固定費', yen(fixOf(p)), '年末の決算で払う。売上から引いた残りが利益になる', costs)}
    ${block('営業力', `${p.power} / ${CFG.POWER_MAX}`, '資産には入らない。営業活動のマスと一部の経営判断で上がる', line('営業・広報マスの売上', `${sellRate(p)}倍`) + line('商品開発マスの値引き', `${Math.round((1 - devOff(p)) * 100)}%`))}
    ${block('投資', '', '足りないと開発できない商品がある。段を上げるほど毎年の費用もかかる', Object.keys(INVEST).map(id => line(`${INVEST[id].label} ${pips(p.level[id], INVEST[id].steps.length)}`, effectNow(p, id), p.level[id] ? investItem(p, id, p.level[id]) : 'まだない')).join(''))}
    <div class="stat"><h3><span>カード</span></h3><ul class="shelf">${hand}</ul></div>
    <button class="ghost" data-all>全社を比べる</button>`);
}

function replaceSheet(list, head, draw, skip) {
  return sheet(`<div class="card">${head}<div class="cards">${list.map((x, i) => `<button class="bigcard" data-go="${i}">${draw(x)}</button>`).join('')}</div>${ghost(skip, 'no')}</div>`);
}

async function offer(p, head, skip = '見送る') {
  const offers = cardOffers(g, p, Math.random);
  if (!offers.length) return;
  const id = await sheet(`<div class="card">${head}<div class="cards">${offers.map(c => `<button class="bigcard" data-go="${c}">${cardFace(p, c)}</button>`).join('')}</div>${ghost(skip, 'no')}</div>`);
  if (id === 'no') return;
  let drop = -1;
  if (p.hand.length >= CFG.HAND) {
    const go = await replaceSheet(p.hand, '<h2 class="ask">手札がいっぱい。どれと入れ替える?</h2>', h => cardFace(p, h), `${CARDS[id].name}はあきらめる`);
    if (go === 'no') return;
    drop = +go;
  }
  give(p, id, drop); S.good();
  meet(CARDS[id]);
  update();
}

async function spin(n, title) {
  const el = $('sheet');
  el.innerHTML = `<div class="card"><h2 class="ask center">${title}</h2><div class="bigdie" id="bigdie">?</div></div>`;
  el.hidden = false;

    d.textContent = die(); S.tick();
    await wait(44 + i * 10);

}

async function landSell(p, t) {
  const before = snap(p), rate = sellRate(p), n = sellTile(p, t), later = TRADES[p.trade].later;

  S.coin(); burst(n, later ? 'paper' : 'gold'); G.cheer(0);

  await sheet(`<div class="card">${heading(t)}<p class="sum">${perTile(powerOf(p))} × ${t.rate}マス分${rate > 1 ? ` × 営業力 ${rate}倍` : ''}${prRate(p, t) < 1 ? ' × 人材がいないので半分' : ''}</p><b class="amount${later ? ' later' : ''}">+${yen(n)}</b>${later ? '<p class="note center">入金は決算のとき</p>' : ''}${changes(before, p)}${carry()}</div>`);
}

async function landLose(p, t) {

const landHq = (p, t) => { meet(t); return offer(p, heading(t, '経営の流れを一周して、やり方を見直した。カードを1枚もらえる。')); };
async function landDesk(p, t) {
  meet(t);
  if (g.pest === 0) { g.pest = null; S.shield(); update(); await banner('悪徳コンサルが離れた', '', 'good'); }
  await offer(p, heading(t, 'カードを2枚もらえる。まず1枚。'));

async function landFund(p, t) {
  meet(t);
  const type = t.fund === 'equity' && p.form !== 'kk' ? 'bank' : t.fund, before = snap(p);
  if (type === 'grant') {
    const n = grantOf(p);
    const go = await sheet(`<div class="card">${heading(t, `申請して、目が3以上なら +${yen(n)}。返済はいらない。`)}${carry('申請する')}${ghost('見送る', 'no')}</div>`);
    if (go === 'no') return;
    const roll = die();
    await spin(roll, '審査の結果は…');
    if (roll >= 3) { p.cash += n; S.fanfare(); burst(n); G.cheer(0); update(); await sheet(`<div class="card"><div class="stamp">採択</div><b class="amount">+${yen(n)}</b>${changes(before, p)}${carry()}</div>`); } else { await sheet(`<div class="card"><div class="stamp bad">不採択</div><p class="note center">今回は通らなかった。損はない。</p>${carry()}</div>`); }
    return;
  }
  if (type === 'equity') {
    const n = equityOf(p);
    const go = await sheet(`<div class="card">${heading(t, `返済はいらないが、毎年の決算で ${yen(n * CFG.DIVIDEND)} の配当を払う。`)}${trial(p, takeEquity)}${carry('出資を受ける')}${ghost('見送る', 'no')}</div>`);
    if (go === 'no') return;
    takeEquity(p); S.coin(); burst(n); update();
    return;
  }
  const n = loanOffer(p), free = type === 'soft';
  if (!n) { await sheet(`<div class="card">${heading(t, 'これ以上は借りられない。会社の種類を変えると、借りられる額が増える。')}${carry()}</div>`); return; }
  const go = await sheet(`<div class="card">${heading(t, `毎年の決算で ${yen(n / CFG.REPAY)} ずつ返す。${free ? '利息はいらない。' : `利息は年${Math.round(CFG.RATE * 100)}%。`}`)}${trial(p, q => borrow(q, n, free))}${carry(`${yen(n)}借りる`)}${ghost('見送る', 'no')}</div>`);
  if (go === 'no') return;
  borrow(p, n, free); S.coin(); burst(n); update();
}

const lockNote = (p, x) => `${INVEST[x.need].label}の段階${x.lv}(${investItem(p, x.need, x.lv)})がないと開発できない`;
// 開発の候補の説明。売れ筋のころの増え方、分野のまとまり、投資との相性
function goodsNote(p, x) {
  const same = p.goods.filter(y => y.genre === x.genre).length;
  const syn = same ? `<br>${x.genre}が${same + 1}つになり、この分野が ×${(1 + CFG.SYN * same).toFixed(2)}` : '';
  const plus = `${INVEST[x.plus].label}の段階${x.lv}`;
  return `売れ筋のころ +${perTile(gainIf(p, x))}${syn}<br>${x.up ? `${plus}があるので売上アップ` : `${plus}があれば売上アップ`}`;
}
const pips = (lv, max) => `<i class="pips">${Array.from({ length: max }, (_, k) => `<b class="${k < lv ? 'on' : ''}"></b>`).join('')}</i>`;
// 投資の今の効き目
function effectNow(p, id) {
  if (id === 'site') return `商品棚 ${shelfOf(p)}`;
  if (id === 'ad') return `評判 ${p.fame ? `+${perTile(p.fame * TRADES[p.trade].rate)}` : 'なし'}`;
  if (id === 'train') return `営業力 ${p.power}`;
  return `商品の売上 ×${labOf(p).toFixed(1)}`;
}
// 次の段に投資すると、効き目と毎年の費用がどう変わるか
function stepNote(p, id) {
  const sim = JSON.parse(JSON.stringify(p)), x = stepOf(p, id);
  invest(sim, id);
  const cost = id === 'site' ? `維持費 毎年 +${yen(x.price * CFG.UPKEEP)}` : `毎年の費用 +${yen(x.run)}`;
  return `${effectNow(p, id)} → ${effectNow(sim, id).replace(/^[^ ]+ /, '')} ・ ${cost}${ties(p, id)}`;
}
// 次の段に投資すると開発できるようになる商品
function ties(p, id) {
  const lv = p.level[id] + 1, list = GOODS[p.trade].flatMap((names, tier) => (tier && levelFor(tier) === lv ? names : [])).filter(n => PLAN[n]?.need === id).join('、');
  return `${id === 'train' && lv === 1 ? '<br>広報活動マスの売上が全額になる' : ''}${list ? `<br>開発できるようになる: ${list}` : ''}`;
}

// 投資。自分の番ならいつでも開ける。強くなるが毎年の費用も増えるので、作戦に合うものに絞る
async function investSheet(p, only = '') {
  for (;;) {
    const rows = Object.keys(INVEST).filter(id => !only || id === only).map(id => {
      const x = stepOf(p, id), lv = p.level[id], max = INVEST[id].steps.length, head = `<span class="inv"><b>${INVEST[id].label}</b>${pips(lv, max)}</span>`;
      if (!x) return `<button class="buy" disabled><span>${head}<small>${INVEST[id].what}</small><small>${effectNow(p, id)} ・ これ以上はない</small></span></button>`;
      const can = x.price <= p.cash;
      return `<button class="buy" data-go="${id}"${can ? '' : ' disabled'}><span>${head}<small>${INVEST[id].what}</small><small class="next">${stepNote(p, id)}</small><small>次: ${investName(p, id)}${can ? '' : ' ・ 現金が足りない'}</small></span><b>${yen(x.price)}</b></button>`;
    }).join('');
    const go = await sheet(`<div class="card"><h2 class="ask big">投資</h2><p class="sub">強くなるが、毎年の費用も増える。全部は選ばず、作戦に合うものに絞る</p><div class="money"><span>現金<b>${yen(p.cash)}</b></span><span>1マスの売上<b>${perTile(powerOf(p))}</b></span><span>毎年の固定費<b>${yen(fixOf(p))}</b></span></div><div class="cards">${rows}</div>${ghost('閉じる', 'no')}</div>`);
    if (go === 'no') return;
    const ok = await sheet(`<div class="card"><h2 class="ask big">${investName(p, go)}</h2><p class="sub">投資するとこう変わる</p>${trial(p, q => invest(q, go))}<p class="sub">${INVEST[go].note}</p>${carry('投資する')}${ghost('やめる', 'no')}</div>`);
    if (ok === 'no') continue;
    meet({ ...INVEST[go], name: investName(p, go) });
    invest(p, go);
    S.good(); G.cheer(0); update();
    if (only) return;
  }
}

// 商品を開発する。棚がいっぱいなら1つやめて入れ替えるか、設備で棚を増やす
async function shopSheet(p, list, off, head) {
  if (!list.length) return false;
  for (;;) {
    const items = list.map(x => judge(p, x));
    const rows = items.map((x, i) => {
      const cost = priceOf(p, x, off), can = x.ok && cost <= p.cash;
      return `<button class="bigcard" data-go="${i}"${can ? '' : ' disabled'}><span class="cb"><b>${x.name}</b>${genreTag(p, x.genre)}<span class="eff">開発費 ${yen(cost)}${x.ok && !can ? ' 現金が足りない' : ''}</span><small class="${x.ok ? '' : 'lock'}">${x.ok ? goodsNote(p, x) : lockNote(p, x)}</small></span>${curve(p, x)}</button>`;
    }).join('');
    const go = await sheet(`<div class="card">${head}<p class="sub">商品棚 ${p.goods.length} / ${shelfOf(p)}</p><div class="cards">${rows}</div>${ghost('投資する', 'invest')}${ghost('見送る', 'no')}</div>`);
    if (go === 'no') return false;
    if (go === 'invest') { await investSheet(p); continue; }
    const item = items[+go];
    let drop = -1;
    if (shelfFull(p)) {
      const room = stepOf(p, 'site');
      const old = await sheet(`<div class="card"><h2 class="ask">商品棚がいっぱい(${p.goods.length} / ${shelfOf(p)})。どれをやめる?</h2><p class="sub">やめた商品は今の価値で手放す。同じ分野がそろっているほど、やめたときに減る売上が大きい</p><div class="cards">${p.goods.map((x, k) => `<button class="bigcard" data-go="${k}"><span class="cb"><b>${x.name}</b>${genreTag(p, x.genre)}<span class="eff">+${yen(saleOf(x))}で手放す</span><small>${stageOf(p, x)} ・ やめると 売上 -${perTile(lossOf(p, k))}</small></span>${curve(p, x)}</button>`).join('')}</div>
        ${room ? `<button class="buy" data-go="site"${room.price <= p.cash ? '' : ' disabled'}><span>やめずに設備で棚を増やす<small>${investName(p, 'site')} ・ 商品棚 ${shelfOf(p)} → ${shelfOf(p) + 1}</small></span><b>${yen(room.price)}</b></button>` : ''}${ghost('やめておく', 'no')}</div>`);
      if (old === 'no') continue;
      if (old === 'site') { await investSheet(p, 'site'); if (shelfFull(p)) continue; }
      else drop = +old;
    }
    const ok = await sheet(`<div class="card"><h2 class="ask big">${item.name}を開発する</h2><p class="sub">開発するとこう変わる</p>${trial(p, q => buy(q, item, off, drop))}<p class="sub">売れ筋のころ +${perTile(gainIf(p, item, drop))}</p>${carry('開発する')}${ghost('やめる', 'no')}</div>`);
    if (ok === 'no') continue;
    buy(p, item, off, drop);
    if (p.goods.filter(x => x.genre === item.genre).length > 1) meet(SYNERGY);
    S.good(); G.cheer(0);
    update();
    return true;
  }
}
const landGoods = (p, t) => { meet(t); const off = devOff(p); return shopSheet(p, goodsOffers(p, Math.random), off, heading(t, `どれかを${Math.round((1 - off) * 100)}%引きで開発できる(営業力 ${p.power})。棒は1年ごとの売れ行き。`)); };

async function landRush(p, t) {
  meet(t);
  p.sum = Math.max(p.sum, t.dice); S.good(); G.cheer(0);

}

async function landEvent(p, t) {
  const opt = side => `<button class="bigcard" data-go="${side}"><span class="cb"><b>${choiceOf(t, side, p.trade)}</b><span class="eff">${fxText(p, t[side].fx).join(' / ')}</span></span></button>`;
  const side = await sheet(`<div class="card">${heading(t)}<div class="cards">${opt('a')}${opt('b')}</div></div>`);
  const fx = t[side].fx, before = snap(p);
  let roll = 0;
  if (fx.bet) { roll = die(); await spin(roll, 'どうなる…'); }
  const res = applyFx(p, fx, roll, { g, who: 0 }), done = fx.bet ? (res.win ? fx.bet.hi : fx.bet.lo) : fx;
  meet(t);
  update();
  if (fx.bet && !res.win) S.tick(); else S.good();
  const text = res.hit ? fxText(p, { ...done, rival: null }).filter(x => x !== '何も起きない').concat(hitText(g, res.hit)) : fxText(p, done);
  await sheet(`<div class="card">${fx.bet ? `<p class="sum">目は ${roll}</p>` : `<p class="kicker">${choiceOf(t, side, p.trade)}</p>`}<p class="note center big-note">${text.join('、')}</p>${changes(before, p)}${carry()}</div>`);
  for (let i = 0; i < res.card; i++) await offer(p, '<h2 class="ask">カードを1枚もらえる</h2>');
}

// 現金が足りなかったときの2択。商品を売って埋めるか、銀行の立て替えのままにするか
async function coverShort(p) {
  const before = snap(p);
  let sold = 0;
  for (;;) {
    const loan = p.loans.find(l => l.bridge && !l.asked);
    if (!loan) break;
    if (!sold) S.bad();
    const rows = p.goods.map((x, k) => `<button class="bigcard" data-go="${k}"><span class="cb"><b>${x.name}</b><span class="eff">${yen(saleOf(x))}で売れる</span><small>${stageOf(p, x)} ・ 売ると 売上 -${perTile(lossOf(p, k))}</small></span>${curve(p, x)}</button>`).join('');
    const go = await sheet(`<div class="card"><p class="kicker">現金が足りない</p><h2 class="ask big">足りない分 ${yen(loan.bridge)}</h2>
      <p class="note">このままだと銀行が立て替えて、1.2倍の ${yen(loan.left)} を2年で返す。商品を売れば、売った分だけ立て替えが減る。</p>
      ${rows ? `<div class="cards">${rows}</div>` : '<p class="sub">売れる商品がない</p>'}${carry('銀行に立て替えてもらう')}</div>`);
    if (go === 'ok') { loan.asked = true; break; }
    sellToCover(p, loan, +go);
    sold += 1;
    S.coin(); update();
  }
  if (!sold) return;
  await sheet(`<div class="card"><h2 class="ask big">商品を売って払った</h2>${changes(before, p)}${carry()}</div>`);
  closeSheet();
}

async function land(p) {
  const t = nodeOf(g, p).tile;
  const run = { hq: landHq, sell: landSell, lose: landLose, card: landCard, desk: landDesk, fund: landFund, goods: landGoods, rush: landRush, event: landEvent }[t.kind];
  if (!run) return;
  G.view('close', p.at);
  await wait(280);
  await run(p, t);
  await coverShort(p);
  closeSheet();
}

// 分かれ道。どの道も損はしない。マスの並びを見て、攻めるか守るかを決める
// k 番目の道を選んだとき、残り left マスで通るマス。途中でもう一度分かれ道に来たら、そこで止める
function laneRun(node, k, left) {
  const list = [];
  let n = g.nodes[node.next[k]];
  for (let s = 1; ; s++) {
    list.push(n);
    if (s >= left) return { list, stop: n };
    if (n.next.length > 1) return { list, stop: null };
    n = g.nodes[n.next[0]];
  }
}
function laneMix(node, k, left) {
  const { list, stop } = laneRun(node, k, left), more = [];
  let n = g.nodes[list[list.length - 1].next[0]];
  // 止まるマスの先も2つだけ見せる
  if (stop) for (let j = 0; j < 2; j++) { more.push(n); n = g.nodes[n.next[0]]; }
  const chip = (x, cls = '') => `<i class="${cls}" style="--c:${G.KIND[x.tile.kind][0]}">${tileChip(x.tile)}</i>`;
  return `<span class="mix">${list.map(x => chip(x, x === stop ? 'stop' : 'pass')).join('')}${more.map(x => chip(x, 'later')).join('')}</span>${stop ? '' : '<small class="refork">この先でもう一度分かれ道を選ぶ</small>'}`;
}
async function myFork(p, node, left) {
  const fork = FORKS[node.fork], wind = windLane(g);
  G.view('fork', node.i);
  G.mark(fork.lanes.map((_, k) => laneRun(node, k, left).stop?.i).filter(i => i !== undefined));
  const list = fork.lanes.map((l, k) => `<button class="bigcard" data-go="${k}"><span class="cb"><b>${l.name}${l.id === wind ? '<i class="windtag">追い風</i>' : ''}</b><span class="eff">抜けると ${passText(p, l)}</span><small>${l.note}</small>${laneMix(node, k, left)}</span></button>`).join('');
  const k = +await sheet(`<div class="card"><div class="left-steps"><span>分かれ道</span><b>あと<em>${left}</em>マス進む</b></div><h3 class="ask">${fork.ask}</h3><p class="sub">金の札が止まるマス。今は${climateOf(g).name}。追い風の道は +${yen(CFG.MATCH * scaleOf(p))}、次の分かれ道まで売上${CFG.TAIL}倍</p><div class="cards">${list}</div></div>`);
  G.mark([]);
  closeSheet();
  const res = chooseLane(g, p, node, k);
  meet(fork.lanes[k]);
  update();
  if (res.ok) { S.good(); burst(res.bonus); say(0, `追い風<em>+${yen(res.bonus)} ・ 売上${CFG.TAIL}倍</em>`, 'good'); await wait(800); hush(); }
  G.view('follow', p.at);
  return k;
}
// 道を抜けたときの効果の説明。攻める道はサイコロ勝負
const passText = (p, lane) => fxText(p, lane.pass, g).join(' / ');
function rivalFork(i, node) {
  const p = g.players[i], k = rivals[i - 1].lane(g, p, node);
  chooseLane(g, p, node, k);
  return k;
}
